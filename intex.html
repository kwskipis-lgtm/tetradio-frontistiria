// ---- storage shim: same get/set interface the app expects, backed by Firestore ----
// Every user who opens this file with the same firebaseConfig shares the same data.
window.storage = {
  get: async (key) => {
    try {
      const snap = await db.collection(COLLECTION).doc(key).get();
      if (!snap.exists) return null;
      return { key, value: snap.data().value, shared: true };
    } catch (e) { console.error("storage.get failed", e); return null; }
  },
  set: async (key, value) => {
    try {
      await db.collection(COLLECTION).doc(key).set({ value, updatedAt: Date.now() });
      return { key, value, shared: true };
    } catch (e) { console.error("storage.set failed", e); return null; }
  },
};

const { useState, useEffect, useMemo } = React;

const MONTHS_EL = [
  "Ιανουάριος", "Φεβρουάριος", "Μάρτιος", "Απρίλιος", "Μάιος", "Ιούνιος",
  "Ιούλιος", "Αύγουστος", "Σεπτέμβριος", "Οκτώβριος", "Νοέμβριος", "Δεκέμβριος"
];
const MONTHS_SHORT = ["Ιαν", "Φεβ", "Μαρ", "Απρ", "Μάι", "Ιουν", "Ιουλ", "Αυγ", "Σεπ", "Οκτ", "Νοε", "Δεκ"];
// JS Date.getDay(): 0=Κυριακή ... 6=Σάββατο
const WEEKDAYS_EL = ["Κυριακή", "Δευτέρα", "Τρίτη", "Τετάρτη", "Πέμπτη", "Παρασκευή", "Σάββατο"];
const WEEKDAYS_GRID = ["Δευ", "Τρι", "Τετ", "Πεμ", "Παρ", "Σαβ", "Κυρ"];
const CATEGORIES = ["Μάθημα", "Αθλητισμός", "Τέχνες", "Άλλο"];

const SUBJECT_COLORS = ["#B5533C", "#4E6E8E", "#6B8F71", "#8A7A57", "#8E5A8A", "#B08A3E", "#3F8280", "#A85C7A"];

function monthKey2(year, monthIdx) { return `${year}-${String(monthIdx + 1).padStart(2, "0")}`; }
function monthKey(d) { return monthKey2(d.getFullYear(), d.getMonth()); }
function fmtEUR(n) { return new Intl.NumberFormat("el-GR", { style: "currency", currency: "EUR" }).format(n || 0); }
function fmtDateLong(iso) {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("el-GR", { weekday: "long", day: "2-digit", month: "long" });
}
function fmtDateShort(iso) {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("el-GR", { day: "2-digit", month: "2-digit", year: "numeric" });
}
function uid() { return Math.random().toString(36).slice(2, 10); }
function daysInMonth(year, monthIdx) { return new Date(year, monthIdx + 1, 0).getDate(); }
function pad2(n) { return String(n).padStart(2, "0"); }
function subjectColor(subjects, id) {
  const idx = subjects.findIndex((s) => s.id === id);
  return SUBJECT_COLORS[idx >= 0 ? idx % SUBJECT_COLORS.length : 0];
}

// Pure: build all lesson occurrences for a given year/month from subjects + that month's saved overrides/extras.
// Supports partial payments: each occurrence tracks paidAmount (€ already settled) and remaining (€ still owed).
// Subjects with startDate/endDate only generate occurrences within that range (e.g. mid-month start, no summer lessons).
function generateOccurrences(year, monthIdx, subjects, monthData) {
  const total = daysInMonth(year, monthIdx);
  const list = [];
  const overrides = (monthData && monthData.overrides) || {};
  const extras = (monthData && monthData.extras) || [];

  for (let day = 1; day <= total; day++) {
    const d = new Date(year, monthIdx, day);
    const iso = `${year}-${pad2(monthIdx + 1)}-${pad2(day)}`;
    const wd = d.getDay();
    subjects.forEach((subj) => {
      if (subj.startDate && iso < subj.startDate) return;
      if (subj.endDate && iso > subj.endDate) return;
      (subj.slots || []).forEach((slot) => {
        if (slot.weekday === wd) {
          const ovKey = `${subj.id}_${iso}_${slot.id}`;
          const ov = overrides[ovKey] || {};
          const cost = Number(subj.cost || 0);
          const paidAmount = Number(ov.paidAmount || 0);
          const remaining = Math.max(0, cost - paidAmount);
          list.push({
            key: ovKey, isExtra: false, subjectId: subj.id, billing: subj.billing || "lesson",
            category: subj.category || CATEGORIES[0], childId: subj.childId || null,
            name: subj.name, date: iso, start: slot.start, end: slot.end,
            cost, paidAmount, remaining, paid: remaining <= 0.005, cancelled: !!ov.cancelled,
          });
        }
      });
    });
  }

  extras.forEach((ex) => {
    const cost = Number(ex.cost || 0);
    const paidAmount = Number(ex.paidAmount || 0);
    const remaining = Math.max(0, cost - paidAmount);
    list.push({
      key: ex.id, isExtra: true, subjectId: ex.subjectId || null, billing: "lesson",
      category: ex.category || CATEGORIES[0], childId: ex.childId || null,
      name: ex.name, date: ex.date, start: ex.start, end: ex.end,
      cost, paidAmount, remaining, paid: remaining <= 0.005, comment: ex.comment, cancelled: !!ex.cancelled,
    });
  });

  list.sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start));
  return list;
}

// Total actual cost (non-cancelled) for one month, plus breakdowns — used by statistics.
function monthCostSummary(year, monthIdx, subjects, monthData, childNameFn) {
  const occ = generateOccurrences(year, monthIdx, subjects, monthData);
  let total = 0;
  const byCategory = {};
  const byChild = {};
  const bump = (map, k, v) => { map[k] = (map[k] || 0) + v; };

  subjects.forEach((subj) => {
    if ((subj.billing || "lesson") === "month") {
      const has = occ.some((o) => o.subjectId === subj.id);
      if (has) {
        const v = Number(subj.cost || 0);
        total += v;
        bump(byCategory, subj.category || CATEGORIES[0], v);
        bump(byChild, childNameFn(subj.childId) || "Χωρίς τίτλο", v);
      }
    }
  });
  occ.filter((o) => o.billing !== "month" && !o.cancelled).forEach((o) => {
    const v = Number(o.cost || 0);
    total += v;
    bump(byCategory, o.category || CATEGORIES[0], v);
    bump(byChild, childNameFn(o.childId) || "Χωρίς τίτλο", v);
  });
  return { total, byCategory, byChild };
}

function TutoringLedger() {
  const [cursor, setCursor] = useState(() => new Date());
  const [children, setChildren] = useState([]);
  const [subjects, setSubjects] = useState([]);
  const [monthData, setMonthData] = useState({ overrides: {}, extras: [], monthlyPayments: {} });
  const [loading, setLoading] = useState(true);
  const [showSubjects, setShowSubjects] = useState(false);
  const [showChildren, setShowChildren] = useState(false);
  const [showExtra, setShowExtra] = useState(false);
  const [showStats, setShowStats] = useState(false);
  const [activeDay, setActiveDay] = useState(null);
  const [settleTarget, setSettleTarget] = useState(null);
  const [undoTarget, setUndoTarget] = useState(null);
  const [error, setError] = useState("");

  const key = monthKey(cursor);
  const label = `${MONTHS_EL[cursor.getMonth()]} ${cursor.getFullYear()}`;
  const todayISO = useMemo(() => new Date().toISOString().slice(0, 10), []);
  const todayD = useMemo(() => new Date(), []);
  const monthStarted =
    cursor.getFullYear() < todayD.getFullYear() ||
    (cursor.getFullYear() === todayD.getFullYear() && cursor.getMonth() <= todayD.getMonth());

  async function loadGlobals() {
    try {
      const c = await window.storage.get("children", true);
      setChildren(c && c.value ? JSON.parse(c.value) : []);
    } catch (e) {}
    try {
      const s = await window.storage.get("subjects", true);
      setSubjects(s && s.value ? JSON.parse(s.value) : []);
    } catch (e) {}
  }
  async function loadMonth() {
    try {
      const res = await window.storage.get(`month:${key}`, true);
      setMonthData(res && res.value ? JSON.parse(res.value) : { overrides: {}, extras: [], monthlyPayments: {} });
    } catch (e) {
      setMonthData({ overrides: {}, extras: [], monthlyPayments: {} });
    }
  }
  async function refreshAll() {
    setLoading(true);
    await Promise.all([loadGlobals(), loadMonth()]);
    setLoading(false);
  }

  useEffect(() => { loadGlobals(); }, []);
  useEffect(() => { setLoading(true); loadMonth().finally(() => setLoading(false)); }, [key]);

  // ---- Fetch-then-mutate-then-write helpers. Always work off the freshest stored data
  // (not the possibly-stale local closure), so two people editing at once merge safely
  // instead of one save silently overwriting the other's recent change. ----
  async function mutateSubjects(mutateFn) {
    let current = subjects;
    try {
      const res = await window.storage.get("subjects", true);
      current = res && res.value ? JSON.parse(res.value) : [];
    } catch (e) {}
    const next = mutateFn(current);
    setSubjects(next);
    try {
      const ok = await window.storage.set("subjects", JSON.stringify(next), true);
      setError(ok ? "" : "Η αποθήκευση απέτυχε. Δοκίμασε ξανά.");
    } catch (e) { setError("Η αποθήκευση απέτυχε. Δοκίμασε ξανά."); }
  }
  async function mutateChildren(mutateFn) {
    let current = children;
    try {
      const res = await window.storage.get("children", true);
      current = res && res.value ? JSON.parse(res.value) : [];
    } catch (e) {}
    const next = mutateFn(current);
    setChildren(next);
    try {
      const ok = await window.storage.set("children", JSON.stringify(next), true);
      setError(ok ? "" : "Η αποθήκευση απέτυχε. Δοκίμασε ξανά.");
    } catch (e) { setError("Η αποθήκευση απέτυχε. Δοκίμασε ξανά."); }
  }
  async function mutateMonth(mutateFn) {
    let current = monthData;
    try {
      const res = await window.storage.get(`month:${key}`, true);
      current = res && res.value ? JSON.parse(res.value) : { overrides: {}, extras: [], monthlyPayments: {} };
    } catch (e) {}
    const next = mutateFn(current);
    setMonthData(next);
    try {
      const ok = await window.storage.set(`month:${key}`, JSON.stringify(next), true);
      setError(ok ? "" : "Η αποθήκευση απέτυχε. Δοκίμασε ξανά.");
    } catch (e) { setError("Η αποθήκευση απέτυχε. Δοκίμασε ξανά."); }
  }

  function childName(id) {
    const c = children.find((x) => x.id === id);
    return c ? c.name : null;
  }

  const occurrences = useMemo(
    () => generateOccurrences(cursor.getFullYear(), cursor.getMonth(), subjects, monthData),
    [subjects, monthData, cursor]
  );

  const byDate = useMemo(() => {
    const map = new Map();
    occurrences.forEach((occ) => {
      if (!map.has(occ.date)) map.set(occ.date, []);
      map.get(occ.date).push(occ);
    });
    return map;
  }, [occurrences]);

  const legendSubjects = useMemo(
    () => subjects.filter((s) => occurrences.some((o) => o.subjectId === s.id)),
    [subjects, occurrences]
  );

  // settleKey is always o.subjectId (real subjects) or `extra_${name}` (freeform extras) —
  // it must match exactly what settleLessonSubject/resetSubjectPayments filter on.
  const totals = useMemo(() => {
    let owed = 0, paidSum = 0, cancelledCount = 0;
    const bySubject = {};

    subjects.forEach((subj) => {
      if ((subj.billing || "lesson") === "month") {
        const has = occurrences.some((o) => o.subjectId === subj.id);
        if (!has) return;
        const cost = Number(subj.cost || 0);
        const paidAmount = Math.min(cost, Number((monthData.monthlyPayments || {})[subj.id] || 0));
        const remaining = Math.max(0, cost - paidAmount);
        cancelledCount += occurrences.filter((o) => o.subjectId === subj.id && o.cancelled).length;
        owed += remaining;
        paidSum += paidAmount;
        bySubject[subj.id] = {
          name: subj.name, childId: subj.childId, billing: "month",
          occurred: remaining > 0.005 && monthStarted ? remaining : 0,
          upcoming: remaining > 0.005 && !monthStarted ? remaining : 0,
          paidTotal: paidAmount,
          settleKey: subj.id,
        };
      }
    });

    occurrences.filter((o) => o.billing !== "month").forEach((o) => {
      if (o.cancelled) { cancelledCount++; return; }
      paidSum += o.paidAmount;
      const skey = o.subjectId || `extra_${o.name}`;
      if (!bySubject[skey]) bySubject[skey] = { name: o.name, childId: o.childId, billing: "lesson", occurred: 0, upcoming: 0, paidTotal: 0, occurredCount: 0, settleKey: skey };
      bySubject[skey].paidTotal += o.paidAmount;
      if (o.remaining > 0.005) {
        owed += o.remaining;
        if (o.date <= todayISO) { bySubject[skey].occurred += o.remaining; bySubject[skey].occurredCount += 1; }
        else bySubject[skey].upcoming += o.remaining;
      }
    });

    return { owed, paidSum, cancelledCount, bySubject };
  }, [occurrences, subjects, monthData, todayISO, monthStarted]);

  function toggleField(occ, field) {
    mutateMonth((current) => {
      if (field === "cancelled") {
        if (occ.isExtra) {
          return { ...current, extras: (current.extras || []).map((ex) => (ex.id === occ.key ? { ...ex, cancelled: !ex.cancelled } : ex)) };
        }
        const cur = current.overrides[occ.key] || {};
        return { ...current, overrides: { ...current.overrides, [occ.key]: { ...cur, cancelled: !cur.cancelled } } };
      }
      // field === "paid": any existing payment (partial or full) is removed on click;
      // only when nothing is paid yet does the click mark it fully paid.
      if (occ.isExtra) {
        const ex = (current.extras || []).find((e) => e.id === occ.key);
        const curPaid = ex ? Number(ex.paidAmount || 0) : 0;
        const newAmount = curPaid > 0.005 ? 0 : occ.cost;
        return { ...current, extras: (current.extras || []).map((e) => (e.id === occ.key ? { ...e, paidAmount: newAmount } : e)) };
      }
      const cur = current.overrides[occ.key] || {};
      const curPaid = Number(cur.paidAmount || 0);
      const newAmount = curPaid > 0.005 ? 0 : occ.cost;
      return { ...current, overrides: { ...current.overrides, [occ.key]: { ...cur, paidAmount: newAmount } } };
    });
  }
  function removeExtra(id) {
    mutateMonth((current) => ({ ...current, extras: (current.extras || []).filter((ex) => ex.id !== id) }));
  }
  function addExtra({ name, childId, category, date, start, end, cost, comment }) {
    const entry = { id: uid(), name, childId: childId || null, category: category || CATEGORIES[0], date, start, end, cost: Number(cost), comment: comment || "", cancelled: false, paidAmount: 0 };
    mutateMonth((current) => ({ ...current, extras: [...(current.extras || []), entry] }));
    setShowExtra(false);
  }
  function settleLessonSubject(settleKey, amount) {
    mutateMonth((current) => {
      let remainingToApply = Math.max(0, Number(amount) || 0);
      if (remainingToApply <= 0) return current;
      const occs = generateOccurrences(cursor.getFullYear(), cursor.getMonth(), subjects, current);
      const candidates = occs.filter((o) => o.billing !== "month" && !o.cancelled && o.remaining > 0.005 && o.date <= todayISO && (o.subjectId || `extra_${o.name}`) === settleKey);
      const nextOverrides = { ...current.overrides };
      const nextExtras = (current.extras || []).map((ex) => ({ ...ex }));
      for (const o of candidates) {
        if (remainingToApply <= 0.005) break;
        const apply = Math.min(o.remaining, remainingToApply);
        const newPaidAmount = o.paidAmount + apply;
        if (o.isExtra) {
          const idx = nextExtras.findIndex((ex) => ex.id === o.key);
          if (idx >= 0) nextExtras[idx].paidAmount = newPaidAmount;
        } else {
          nextOverrides[o.key] = { ...(nextOverrides[o.key] || {}), paidAmount: newPaidAmount };
        }
        remainingToApply -= apply;
      }
      return { ...current, overrides: nextOverrides, extras: nextExtras };
    });
  }
  function settleMonthSubject(subjectId, amount) {
    mutateMonth((current) => {
      const subj = subjects.find((s) => s.id === subjectId);
      const cap = subj ? Number(subj.cost || 0) : Infinity;
      const cur = Number((current.monthlyPayments || {})[subjectId] || 0);
      const next = Math.min(cap, cur + Math.max(0, Number(amount) || 0));
      return { ...current, monthlyPayments: { ...(current.monthlyPayments || {}), [subjectId]: next } };
    });
  }
  function resetSubjectPayments(target) {
    mutateMonth((current) => {
      if (target.billing === "month") {
        return { ...current, monthlyPayments: { ...(current.monthlyPayments || {}), [target.settleKey]: 0 } };
      }
      const occs = generateOccurrences(cursor.getFullYear(), cursor.getMonth(), subjects, current);
      const nextOverrides = { ...current.overrides };
      const nextExtras = (current.extras || []).map((ex) => ({ ...ex }));
      occs.filter((o) => o.billing !== "month" && (o.subjectId || `extra_${o.name}`) === target.settleKey).forEach((o) => {
        if (o.isExtra) {
          const idx = nextExtras.findIndex((ex) => ex.id === o.key);
          if (idx >= 0) nextExtras[idx].paidAmount = 0;
        } else {
          nextOverrides[o.key] = { ...(nextOverrides[o.key] || {}), paidAmount: 0 };
        }
      });
      return { ...current, overrides: nextOverrides, extras: nextExtras };
    });
  }
  function confirmSettle(amount) {
    if (!settleTarget) return;
    if (settleTarget.billing === "month") settleMonthSubject(settleTarget.settleKey, amount);
    else settleLessonSubject(settleTarget.settleKey, amount);
    setSettleTarget(null);
  }
  function confirmUndo() {
    if (!undoTarget) return;
    resetSubjectPayments(undoTarget);
    setUndoTarget(null);
  }

  function shiftMonth(delta) {
    const d = new Date(cursor);
    d.setMonth(d.getMonth() + delta);
    setCursor(d);
    setActiveDay(null);
  }
  function saveSubject(subj) {
    mutateSubjects((current) => {
      const exists = current.some((s) => s.id === subj.id);
      return exists ? current.map((s) => (s.id === subj.id ? subj : s)) : [...current, subj];
    });
  }
  function deleteSubject(id) {
    mutateSubjects((current) => current.filter((s) => s.id !== id));
  }
  function addChild(name) {
    mutateChildren((current) => [...current, { id: uid(), name }]);
  }
  function deleteChild(id) {
    mutateChildren((current) => current.filter((c) => c.id !== id));
    mutateSubjects((current) => current.map((s) => (s.childId === id ? { ...s, childId: null } : s)));
  }

  const gridCells = useMemo(() => {
    const year = cursor.getFullYear(), monthIdx = cursor.getMonth();
    const first = new Date(year, monthIdx, 1);
    const offset = (first.getDay() + 6) % 7;
    const total = daysInMonth(year, monthIdx);
    const cells = [];
    for (let i = 0; i < offset; i++) cells.push(null);
    for (let d = 1; d <= total; d++) cells.push(`${year}-${pad2(monthIdx + 1)}-${pad2(d)}`);
    while (cells.length % 7 !== 0) cells.push(null);
    return cells;
  }, [cursor]);

  return (
    <div style={{ background: "#F7F5EF", minHeight: "100%", fontFamily: "'Iowan Old Style', 'Georgia', serif", color: "#20293A", padding: "24px 16px 60px" }}>
      <div style={{ maxWidth: 560, margin: "0 auto" }}>
        <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 4 }}>
          <h1 style={{ fontSize: 22, fontWeight: 600, margin: 0, letterSpacing: 0.2 }}>Τετράδιο φροντιστηρίων</h1>
          <div style={{ display: "flex", gap: 2 }}>
            <button onClick={refreshAll} style={headerIconBtn} aria-label="Ανανέωση"><RefreshCw size={18} /></button>
            <button onClick={() => setShowStats(true)} style={headerIconBtn} aria-label="Στατιστικά"><BarChart3 size={18} /></button>
            <button onClick={() => setShowChildren(true)} style={headerIconBtn} aria-label="Τίτλοι"><Users size={18} /></button>
            <button onClick={() => setShowSubjects(true)} style={headerIconBtn} aria-label="Μαθήματα"><Settings2 size={18} /></button>
          </div>
        </div>
        <p style={{ fontFamily: "system-ui, sans-serif", fontSize: 13, color: "#6B6455", margin: "0 0 20px" }}>
          Πρόγραμμα, κόστος και ιστορικό ανά μήνα · κοινόχρηστο για όσους ανοίγουν αυτή τη σελίδα.
        </p>

        <div style={monthNavStyle}>
          <button onClick={() => shiftMonth(-1)} style={navBtn} aria-label="Προηγούμενος μήνας"><ChevronLeft size={18} /></button>
          <div style={{ fontFamily: "system-ui, sans-serif", fontWeight: 600, fontSize: 15 }}>{label}</div>
          <button onClick={() => shiftMonth(1)} style={navBtn} aria-label="Επόμενος μήνας"><ChevronRight size={18} /></button>
        </div>

        <div style={totalsCard}>
          <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between" }}>
            <span style={{ fontFamily: "system-ui, sans-serif", fontSize: 13, color: "#6B6455" }}>Σύνολο οφειλής μήνα</span>
            <span style={{ fontSize: 30, fontWeight: 700, color: "#B5533C", fontVariantNumeric: "tabular-nums" }}>{fmtEUR(totals.owed)}</span>
          </div>
          {Object.keys(totals.bySubject).length > 0 && (
            <div style={{ marginTop: 10, paddingTop: 10, borderTop: "1px dashed #E4DECC" }}>
              {Object.values(totals.bySubject).map((b) => {
                const cname = childName(b.childId);
                return (
                  <div key={b.settleKey} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "4px 0", fontFamily: "system-ui, sans-serif", fontSize: 13 }}>
                    <span style={{ color: "#20293A" }}>
                      {b.name}
                      {cname && <span style={{ color: "#9A8F72", fontSize: 11.5 }}> · {cname}</span>}
                      {b.billing === "month" && <span style={{ color: "#9A8F72", fontSize: 11.5 }}> · μηνιαίο</span>}
                      {b.upcoming > 0 && <span style={{ color: "#9A8F72", fontSize: 11.5 }}> · προγραμματισμένα {fmtEUR(b.upcoming)}</span>}
                    </span>
                    {b.occurred > 0 ? (
                      <button onClick={() => setSettleTarget({ ...b, childName: cname })} style={settleBtn} title="Εξόφληση">
                        {fmtEUR(b.occurred)} <CheckCircle2 size={13} />
                      </button>
                    ) : b.paidTotal > 0.005 ? (
                      <button onClick={() => setUndoTarget({ ...b, childName: cname })} style={{ ...settleBtn, background: "#EAF1EA", color: "#5C7A5F" }} title="Αναίρεση πληρωμής">
                        {fmtEUR(b.paidTotal)} <Undo2 size={13} />
                      </button>
                    ) : (
                      <span style={{ color: "#9A8F72", fontSize: 12.5 }}>—</span>
                    )}
                  </div>
                );
              })}
              <div style={{ display: "flex", gap: 16, marginTop: 6, fontFamily: "system-ui, sans-serif", fontSize: 12.5, color: "#6B6455" }}>
                {totals.paidSum > 0 && <span>Εξοφλήθηκαν: {fmtEUR(totals.paidSum)}</span>}
                {totals.cancelledCount > 0 && <span>Ακυρωμένα: {totals.cancelledCount}</span>}
              </div>
            </div>
          )}
        </div>

        <div style={{ marginBottom: 14 }}>
          <button onClick={() => setShowExtra(true)} style={{ ...addBtn, width: "100%", background: "#fff", color: "#8A7A57", border: "1px solid #D8C9A0" }}>
            <Plus size={15} /> Έκτακτη δραστηριότητα
          </button>
        </div>

        {loading ? (
          <p style={{ fontFamily: "system-ui, sans-serif", fontSize: 13, color: "#6B6455" }}>Φόρτωση…</p>
        ) : subjects.length === 0 ? (
          <div style={emptyState}>
            Δεν έχεις ορίσει ακόμα μαθήματα. Πάτησε το <Settings2 size={13} style={{ verticalAlign: -2 }} /> πάνω δεξιά για να προσθέσεις το πρώτο, με τις μέρες και ώρες του.
          </div>
        ) : (
          <>
            <div style={{ background: "#FFFFFF", border: "1px solid #E4DECC", borderRadius: 10, padding: 8, marginBottom: 8 }}>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)" }}>
                {WEEKDAYS_GRID.map((w) => (
                  <div key={w} style={{ fontFamily: "system-ui, sans-serif", fontSize: 10.5, color: "#9A8F72", textAlign: "center", padding: "4px 0" }}>{w}</div>
                ))}
                {gridCells.map((iso, i) => {
                  if (!iso) return <div key={i} />;
                  const occs = byDate.get(iso) || [];
                  const isToday = iso === todayISO;
                  const dayNum = Number(iso.slice(-2));
                  const shown = occs.slice(0, 4);
                  const extra = occs.length - shown.length;
                  return (
                    <button
                      key={iso}
                      onClick={() => occs.length > 0 && setActiveDay(iso)}
                      style={{
                        border: "1px solid #EFEAD9", borderRadius: 6, minHeight: 46, padding: "3px 2px",
                        background: isToday ? "#F1ECDD" : "transparent", cursor: occs.length ? "pointer" : "default",
                        display: "flex", flexDirection: "column", alignItems: "center", gap: 3,
                      }}
                    >
                      <span style={{ fontFamily: "system-ui, sans-serif", fontSize: 11.5, fontWeight: isToday ? 700 : 500, color: isToday ? "#B5533C" : "#20293A" }}>{dayNum}</span>
                      <div style={{ display: "flex", gap: 2, flexWrap: "wrap", justifyContent: "center", minHeight: 6 }}>
                        {shown.map((o) => (
                          <span key={o.key} style={{ width: 6, height: 6, borderRadius: "50%", background: o.cancelled ? "transparent" : subjectColor(subjects, o.subjectId), border: o.cancelled ? `1px solid ${subjectColor(subjects, o.subjectId)}` : "none" }} />
                        ))}
                        {extra > 0 && <span style={{ fontSize: 8, color: "#9A8F72" }}>+{extra}</span>}
                      </div>
                    </button>
                  );
                })}
              </div>
            </div>

            {legendSubjects.length > 0 && (
              <div style={{ display: "flex", flexWrap: "wrap", gap: "6px 14px", padding: "2px 4px 6px", fontFamily: "system-ui, sans-serif", fontSize: 12, color: "#6B6455" }}>
                {legendSubjects.map((s) => (
                  <span key={s.id} style={{ display: "flex", alignItems: "center", gap: 5 }}>
                    <span style={{ width: 8, height: 8, borderRadius: "50%", background: subjectColor(subjects, s.id), flexShrink: 0 }} />
                    {s.name}{childName(s.childId) && ` · ${childName(s.childId)}`}
                  </span>
                ))}
              </div>
            )}
            <p style={{ fontFamily: "system-ui, sans-serif", fontSize: 11.5, color: "#9A8F72", padding: "0 4px 16px" }}>
              Πάτα σε μια ημέρα του ημερολογίου για να ακυρώσεις ή να εξοφλήσεις ένα συγκεκριμένο μάθημα.
            </p>
          </>
        )}

        {error && <p style={{ fontFamily: "system-ui, sans-serif", fontSize: 12, color: "#B5533C", marginTop: 12 }}>{error}</p>}
      </div>

      {activeDay && (
        <DayDetailModal date={activeDay} occs={byDate.get(activeDay) || []} subjects={subjects} childName={childName} onClose={() => setActiveDay(null)} onToggle={toggleField} onRemove={removeExtra} />
      )}
      {showSubjects && (
        <SubjectsModal subjects={subjects} children={children} onClose={() => setShowSubjects(false)} onSave={saveSubject} onDelete={deleteSubject} onAddChild={addChild} />
      )}
      {showChildren && (
        <ChildrenModal children={children} onClose={() => setShowChildren(false)} onAdd={addChild} onDelete={deleteChild} />
      )}
      {showExtra && (
        <ExtraLessonModal subjects={subjects} children={children} onClose={() => setShowExtra(false)} onSave={addExtra} />
      )}
      {showStats && (
        <StatsModal subjects={subjects} childName={childName} initialYear={cursor.getFullYear()} onClose={() => setShowStats(false)} />
      )}
      {settleTarget && (
        <SettleConfirmModal target={settleTarget} onCancel={() => setSettleTarget(null)} onConfirm={confirmSettle} />
      )}
      {undoTarget && (
        <UndoConfirmModal target={undoTarget} onCancel={() => setUndoTarget(null)} onConfirm={confirmUndo} />
      )}
    </div>
  );
}

const headerIconBtn = { background: "none", border: "none", cursor: "pointer", color: "#8A7A57", display: "flex", alignItems: "center", padding: 4 };
const monthNavStyle = { display: "flex", alignItems: "center", justifyContent: "space-between", background: "#20293A", color: "#F7F5EF", borderRadius: 10, padding: "10px 14px", marginBottom: 14 };
const totalsCard = { background: "#FFFFFF", border: "1px solid #E4DECC", borderRadius: 10, padding: "16px 18px", marginBottom: 18 };
const emptyState = { textAlign: "center", padding: "36px 16px", color: "#9A8F72", fontFamily: "system-ui, sans-serif", fontSize: 13.5, lineHeight: 1.6 };
const navBtn = { background: "rgba(255,255,255,0.08)", border: "none", borderRadius: 6, color: "#F7F5EF", padding: 6, cursor: "pointer", display: "flex" };
const addBtn = { display: "flex", alignItems: "center", justifyContent: "center", gap: 6, fontFamily: "system-ui, sans-serif", fontSize: 13.5, fontWeight: 600, padding: "10px 0", borderRadius: 8, cursor: "pointer" };
const iconBtn = { background: "none", border: "none", color: "#9A8F72", cursor: "pointer", padding: 5, display: "flex" };
const settleBtn = { display: "flex", alignItems: "center", gap: 5, background: "#F1ECDD", border: "none", borderRadius: 6, padding: "4px 9px", fontSize: 12.5, fontWeight: 600, color: "#8A7A57", cursor: "pointer" };
const fieldLabel = { display: "block", fontSize: 12, color: "#6B6455", marginBottom: 4, marginTop: 12, fontWeight: 600 };
const fieldInput = { width: "100%", boxSizing: "border-box", border: "1px solid #DDD6C8", borderRadius: 8, padding: "9px 10px", fontSize: 14, fontFamily: "system-ui, sans-serif", background: "#fff", color: "#20293A" };
const primaryBtn = { width: "100%", marginTop: 8, background: "#20293A", color: "#F7F5EF", border: "none", borderRadius: 8, padding: "12px 0", fontWeight: 600, fontSize: 14, cursor: "pointer", fontFamily: "system-ui, sans-serif" };
const rowStyle = { display: "flex", alignItems: "center", gap: 10, padding: "10px 6px", borderBottom: "1px solid #E9E3D2" };
const toggleChip = { flex: 1, border: "1px solid #DDD6C8", borderRadius: 8, padding: "9px 0", fontSize: 13, fontWeight: 600, background: "#fff", color: "#6B6455", cursor: "pointer" };
const toggleChipActive = { background: "#20293A", color: "#F7F5EF", border: "1px solid #20293A" };

function overlay() { return { position: "fixed", inset: 0, background: "rgba(32,41,58,0.45)", display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 50 }; }
function sheet() { return { background: "#FFFDF8", width: "100%", maxWidth: 420, maxHeight: "85vh", overflowY: "auto", borderRadius: "16px 16px 0 0", padding: "20px 20px 28px", fontFamily: "system-ui, sans-serif" }; }

function DayDetailModal({ date, occs, subjects, childName, onClose, onToggle, onRemove }) {
  return (
    <div style={overlay()}>
      <div onClick={(e) => e.stopPropagation()} style={sheet()}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
          <h2 style={{ margin: 0, fontSize: 15, fontWeight: 700, color: "#20293A", textTransform: "capitalize" }}>{fmtDateLong(date)}</h2>
          <button onClick={onClose} style={iconBtn}><X size={18} /></button>
        </div>
        {occs.map((occ) => {
          const cancelled = occ.cancelled;
          const paid = occ.paid && !cancelled;
          const partial = !cancelled && !paid && occ.paidAmount > 0.005;
          const isMonthBilled = occ.billing === "month";
          const cname = childName(occ.childId);
          const color = subjectColor(subjects, occ.subjectId);
          return (
            <div key={occ.key} style={{ ...rowStyle, opacity: cancelled ? 0.55 : 1 }}>
              <div style={{ width: 4, alignSelf: "stretch", borderRadius: 2, background: color, flexShrink: 0 }} />
              <div style={{ width: 74, flexShrink: 0, fontSize: 12.5, color: "#6B6455", fontVariantNumeric: "tabular-nums" }}>{occ.start}–{occ.end}</div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 14, fontWeight: 500, textDecoration: cancelled ? "line-through" : "none" }}>
                  {occ.name}{cname && ` · ${cname}`}{occ.isExtra && "  ·  έκτακτο"}{cancelled && "  ·  ακυρώθηκε"}{!cancelled && paid && !isMonthBilled && "  ·  εξοφλήθηκε"}{partial && !isMonthBilled && "  ·  μερική εξόφληση"}
                </div>
                {occ.comment && <div style={{ fontSize: 12, color: "#9A8F72", marginTop: 1 }}>{occ.comment}</div>}
                {isMonthBilled && <div style={{ fontSize: 11.5, color: "#9A8F72", marginTop: 1 }}>χρεώνεται μηνιαία</div>}
              </div>
              {!isMonthBilled && (
                <div style={{ fontSize: 14, fontWeight: 600, fontVariantNumeric: "tabular-nums", minWidth: 54, textAlign: "right", textDecoration: cancelled ? "line-through" : "none", color: cancelled ? "#9A8F72" : paid ? "#5C7A5F" : partial ? "#B08A3E" : "#20293A" }}>
                  {fmtEUR(occ.remaining)}
                </div>
              )}
              <div style={{ display: "flex", gap: 2, flexShrink: 0 }}>
                {!cancelled && !isMonthBilled && (
                  <button onClick={() => onToggle(occ, "paid")} title={occ.paidAmount > 0.005 ? "Αναίρεση πληρωμής" : "Πλήρης εξόφληση"} style={{ ...iconBtn, color: paid ? "#5C7A5F" : partial ? "#B08A3E" : "#9A8F72" }}>
                    {paid ? <CheckCircle2 size={15} /> : <Circle size={15} />}
                  </button>
                )}
                <button onClick={() => onToggle(occ, "cancelled")} title={cancelled ? "Επαναφορά" : "Ακύρωση"} style={iconBtn}>
                  {cancelled ? <Undo2 size={15} /> : <Ban size={15} />}
                </button>
                {occ.isExtra && <button onClick={() => onRemove(occ.key)} title="Διαγραφή" style={iconBtn}><X size={15} /></button>}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function ChildrenModal({ children, onClose, onAdd, onDelete }) {
  const [name, setName] = useState("");
  return (
    <div style={overlay()}>
      <div onClick={(e) => e.stopPropagation()} style={sheet()}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
          <h2 style={{ margin: 0, fontSize: 16, fontWeight: 700, color: "#20293A" }}>Τίτλοι</h2>
          <button onClick={onClose} style={iconBtn}><X size={18} /></button>
        </div>
        {children.length === 0 && <p style={{ fontSize: 13, color: "#9A8F72", marginBottom: 12 }}>Πρόσθεσε τίτλους (π.χ. τα ονόματα των παιδιών) — κάθε τίτλος έχει από κάτω το δικό του πρόγραμμα μαθημάτων/δραστηριοτήτων.</p>}
        {children.map((c) => (
          <div key={c.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", border: "1px solid #E4DECC", borderRadius: 8, padding: "9px 12px", marginBottom: 8 }}>
            <span style={{ fontSize: 14, fontWeight: 500 }}>{c.name}</span>
            <button onClick={() => onDelete(c.id)} style={iconBtn} title="Διαγραφή"><Trash2 size={15} /></button>
          </div>
        ))}
        <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
          <input type="text" value={name} onChange={(e) => setName(e.target.value)} placeholder="Νέος τίτλος" style={fieldInput} />
          <button onClick={() => { if (name.trim()) { onAdd(name.trim()); setName(""); } }} style={{ ...iconBtn, background: "#20293A", color: "#F7F5EF", borderRadius: 8, padding: "9px 12px" }}>
            <Plus size={16} />
          </button>
        </div>
      </div>
    </div>
  );
}

function SubjectsModal({ subjects, children, onClose, onSave, onDelete, onAddChild }) {
  const [editing, setEditing] = useState(null);
  const [newTitle, setNewTitle] = useState("");

  if (editing) {
    return <SubjectForm subject={editing} children={children} onCancel={() => setEditing(null)} onSave={(s) => { onSave(s); setEditing(null); }} />;
  }

  const groups = children.map((c) => ({ child: c, items: subjects.filter((s) => s.childId === c.id) }));
  const knownIds = children.map((c) => c.id);
  const ungrouped = subjects.filter((s) => !s.childId || !knownIds.includes(s.childId));

  function renderSubjectRow(s) {
    return (
      <div key={s.id} style={{ border: "1px solid #E4DECC", borderRadius: 8, padding: "10px 12px", marginBottom: 8 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div>
            <div style={{ fontWeight: 600, fontSize: 14, display: "flex", alignItems: "center", gap: 6 }}>
              <span style={{ width: 9, height: 9, borderRadius: "50%", background: subjectColor(subjects, s.id), flexShrink: 0 }} />
              {s.name}
            </div>
            <div style={{ fontSize: 12, color: "#9A8F72", marginTop: 2 }}>
              {s.category || CATEGORIES[0]} · {(s.slots || []).map((sl) => `${WEEKDAYS_EL[sl.weekday].slice(0, 3)} ${sl.start}-${sl.end}`).join(" · ")}
              {"  ·  "}{fmtEUR(s.cost)}{(s.billing || "lesson") === "month" ? "/μήνα" : "/μάθημα"}
              {(s.startDate || s.endDate) && (
                <><br />{s.startDate ? `από ${fmtDateShort(s.startDate)}` : "χωρίς έναρξη"}{" · "}{s.endDate ? `έως ${fmtDateShort(s.endDate)}` : "χωρίς λήξη"}</>
              )}
            </div>
          </div>
          <div style={{ display: "flex", gap: 2 }}>
            <button onClick={() => setEditing(s)} style={iconBtn} title="Επεξεργασία"><Pencil size={15} /></button>
            <button onClick={() => onDelete(s.id)} style={iconBtn} title="Διαγραφή"><Trash2 size={15} /></button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div style={overlay()}>
      <div onClick={(e) => e.stopPropagation()} style={sheet()}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
          <h2 style={{ margin: 0, fontSize: 16, fontWeight: 700, color: "#20293A" }}>Μαθήματα &amp; δραστηριότητες</h2>
          <button onClick={onClose} style={iconBtn}><X size={18} /></button>
        </div>

        {children.length === 0 && subjects.length === 0 && (
          <p style={{ fontSize: 13, color: "#9A8F72", marginBottom: 4 }}>
            Πρόσθεσε πρώτα έναν τίτλο (π.χ. το όνομα ενός παιδιού) — από κάτω του θα φτιάχνεις το δικό του πρόγραμμα.
          </p>
        )}

        <div style={{ display: "flex", gap: 6, marginBottom: 18 }}>
          <input type="text" value={newTitle} onChange={(e) => setNewTitle(e.target.value)} placeholder="Νέος τίτλος (π.χ. όνομα παιδιού)" style={fieldInput} />
          <button onClick={() => { if (newTitle.trim()) { onAddChild(newTitle.trim()); setNewTitle(""); } }} style={{ ...iconBtn, background: "#20293A", color: "#F7F5EF", borderRadius: 8, padding: "9px 12px" }}>
            <Plus size={16} />
          </button>
        </div>

        {groups.map(({ child, items }) => (
          <div key={child.id} style={{ marginBottom: 18 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8, borderBottom: "2px solid #20293A", paddingBottom: 6 }}>
              <div style={{ fontSize: 15, fontWeight: 700, color: "#20293A" }}>{child.name}</div>
              <button
                onClick={() => setEditing({ id: uid(), name: "", cost: 15, billing: "lesson", category: CATEGORIES[0], childId: child.id, startDate: "", endDate: "", slots: [] })}
                style={{ ...iconBtn, color: "#8A7A57" }} title={`Νέα καταχώριση για ${child.name}`}
              >
                <Plus size={16} />
              </button>
            </div>
            {items.length === 0 ? (
              <p style={{ fontSize: 12.5, color: "#9A8F72", margin: "0 0 8px" }}>Καμία καταχώριση ακόμα — πάτα το + για να προσθέσεις.</p>
            ) : items.map(renderSubjectRow)}
          </div>
        ))}

        {(ungrouped.length > 0 || children.length === 0) && (
          <div style={{ marginBottom: 8 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8, borderBottom: "2px solid #D8C9A0", paddingBottom: 6 }}>
              <div style={{ fontSize: 15, fontWeight: 700, color: "#20293A" }}>Χωρίς τίτλο</div>
              <button
                onClick={() => setEditing({ id: uid(), name: "", cost: 15, billing: "lesson", category: CATEGORIES[0], childId: null, startDate: "", endDate: "", slots: [] })}
                style={{ ...iconBtn, color: "#8A7A57" }} title="Νέα καταχώριση"
              >
                <Plus size={16} />
              </button>
            </div>
            {ungrouped.length === 0 ? (
              <p style={{ fontSize: 12.5, color: "#9A8F72", margin: 0 }}>Καταχωρίσεις χωρίς συγκεκριμένο τίτλο θα εμφανίζονται εδώ.</p>
            ) : ungrouped.map(renderSubjectRow)}
          </div>
        )}
      </div>
    </div>
  );
}

function SubjectForm({ subject, children, onCancel, onSave }) {
  const [name, setName] = useState(subject.name);
  const [cost, setCost] = useState(subject.cost);
  const [billing, setBilling] = useState(subject.billing || "lesson");
  const [category, setCategory] = useState(subject.category || CATEGORIES[0]);
  const [childId, setChildId] = useState(subject.childId || "");
  const [startDate, setStartDate] = useState(subject.startDate || "");
  const [endDate, setEndDate] = useState(subject.endDate || "");
  const [slots, setSlots] = useState(subject.slots && subject.slots.length ? subject.slots : []);
  const [newWeekday, setNewWeekday] = useState(1);
  const [newStart, setNewStart] = useState("17:00");
  const [newEnd, setNewEnd] = useState("18:00");

  function addSlot() { setSlots([...slots, { id: uid(), weekday: Number(newWeekday), start: newStart, end: newEnd }]); }
  function removeSlot(id) { setSlots(slots.filter((s) => s.id !== id)); }

  return (
    <div style={overlay()}>
      <div onClick={(e) => e.stopPropagation()} style={sheet()}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
          <h2 style={{ margin: 0, fontSize: 16, fontWeight: 700, color: "#20293A" }}>{subject.name ? "Επεξεργασία καταχώρισης" : "Νέα καταχώριση"}</h2>
          <button onClick={onCancel} style={iconBtn}><X size={18} /></button>
        </div>

        <label style={fieldLabel}>Όνομα</label>
        <input type="text" value={name} onChange={(e) => setName(e.target.value)} style={fieldInput} placeholder="π.χ. Χημεία, Κολύμβηση" />

        <label style={fieldLabel}>Κατηγορία</label>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
          {CATEGORIES.map((c) => (
            <button key={c} onClick={() => setCategory(c)} style={{ ...toggleChip, flex: "none", padding: "7px 14px", ...(category === c ? toggleChipActive : {}) }}>{c}</button>
          ))}
        </div>

        {children.length > 0 && (
          <>
            <label style={fieldLabel}>Τίτλος</label>
            <select value={childId} onChange={(e) => setChildId(e.target.value)} style={fieldInput}>
              <option value="">Χωρίς τίτλο</option>
              {children.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
          </>
        )}

        <label style={fieldLabel}>Τρόπος χρέωσης</label>
        <div style={{ display: "flex", gap: 6 }}>
          <button onClick={() => setBilling("lesson")} style={{ ...toggleChip, ...(billing === "lesson" ? toggleChipActive : {}) }}>Ανά μάθημα</button>
          <button onClick={() => setBilling("month")} style={{ ...toggleChip, ...(billing === "month" ? toggleChipActive : {}) }}>Σταθερό ανά μήνα</button>
        </div>

        <label style={fieldLabel}>{billing === "month" ? "Κόστος ανά μήνα (€)" : "Κόστος ανά μάθημα (€)"}</label>
        <input type="number" step="0.5" min="0" value={cost} onChange={(e) => setCost(e.target.value)} style={fieldInput} />

        <label style={fieldLabel}>Περίοδος ισχύος (προαιρετικό)</label>
        <div style={{ display: "flex", gap: 8 }}>
          <div style={{ flex: 1 }}>
            <label style={{ fontSize: 11.5, color: "#9A8F72", display: "block", marginBottom: 3 }}>Έναρξη</label>
            <input type="date" value={startDate} onChange={(e) => setStartDate(e.target.value)} style={fieldInput} />
          </div>
          <div style={{ flex: 1 }}>
            <label style={{ fontSize: 11.5, color: "#9A8F72", display: "block", marginBottom: 3 }}>Λήξη</label>
            <input type="date" value={endDate} onChange={(e) => setEndDate(e.target.value)} style={fieldInput} />
          </div>
        </div>
        <p style={{ fontSize: 11.5, color: "#9A8F72", margin: "5px 0 0" }}>Άσε κενό αν δεν έχει όριο. Χρήσιμο όταν ξεκινά στα μέσα του μήνα ή σταματά το καλοκαίρι — εκτός αυτής της περιόδου δεν χρεώνεται καθόλου.</p>

        <label style={{ ...fieldLabel }}>Σταθερές μέρες &amp; ώρες</label>
        {slots.length > 0 && (
          <div style={{ marginBottom: 8 }}>
            {slots.map((sl) => (
              <div key={sl.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "7px 10px", background: "#F1ECDD", borderRadius: 6, marginBottom: 4 }}>
                <span style={{ fontSize: 13 }}>{WEEKDAYS_EL[sl.weekday]} {sl.start}–{sl.end}</span>
                <button onClick={() => removeSlot(sl.id)} style={iconBtn}><X size={14} /></button>
              </div>
            ))}
          </div>
        )}
        <div style={{ display: "flex", gap: 6, alignItems: "flex-end" }}>
          <div style={{ flex: 1.3 }}>
            <label style={{ ...fieldLabel, marginTop: 0 }}>Μέρα</label>
            <select value={newWeekday} onChange={(e) => setNewWeekday(e.target.value)} style={fieldInput}>
              {WEEKDAYS_EL.map((w, i) => <option key={i} value={i}>{w}</option>)}
            </select>
          </div>
          <div style={{ flex: 1 }}>
            <label style={{ ...fieldLabel, marginTop: 0 }}>Από</label>
            <input type="time" value={newStart} onChange={(e) => setNewStart(e.target.value)} style={fieldInput} />
          </div>
          <div style={{ flex: 1 }}>
            <label style={{ ...fieldLabel, marginTop: 0 }}>Έως</label>
            <input type="time" value={newEnd} onChange={(e) => setNewEnd(e.target.value)} style={fieldInput} />
          </div>
          <button onClick={addSlot} style={{ ...iconBtn, background: "#20293A", color: "#F7F5EF", borderRadius: 8, padding: "9px 10px" }} title="Προσθήκη ώρας"><Plus size={16} /></button>
        </div>

        <button
          onClick={() => name.trim() && onSave({ id: subject.id, name: name.trim(), cost: Number(cost), billing, category, childId: childId || null, startDate: startDate || "", endDate: endDate || "", slots })}
          style={primaryBtn}
        >
          Αποθήκευση
        </button>
      </div>
    </div>
  );
}

          <button onClick={onClose} style={iconBtn}><X size={18} /></button>

            <label style={fieldLabel}>Τίτλος</label>
            <select value={childId} onChange={(e) => setChildId(e.target.value)} style={fieldInput}>

        <label style={fieldLabel}>Σχόλιο (π.χ. αναπλήρωση)</label>
        <textarea value={comment} onChange={(e) => setComment(e.target.value)} rows={2} style={{ ...fieldInput, resize: "none" }} />

        <button onClick={() => name.trim() && date && onSave({ name: name.trim(), childId: childId || null, category, date, start, end, cost, comment })} style={primaryBtn}>

}

function StatsModal({ subjects, childName, initialYear, onClose }) {
  const [year, setYear] = useState(initialYear);
  const [monthTotals, setMonthTotals] = useState(null); // array of 12 {total}
  const [byCategory, setByCategory] = useState({});
  const [byChild, setByChild] = useState({});
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    let cancelled = false;
    setLoading(true);
    (async () => {
      const results = await Promise.all(
        Array.from({ length: 12 }, (_, m) =>
          window.storage.get(`month:${monthKey2(year, m)}`, true).catch(() => null)
        )
      );
      if (cancelled) return;
      const months = [];
      const catAgg = {};
      const childAgg = {};
      results.forEach((res, m) => {
        const data = res && res.value ? JSON.parse(res.value) : { overrides: {}, extras: [], monthlyPayments: {} };
        const summary = monthCostSummary(year, m, subjects, data, childName);
        months.push(summary.total);
        Object.entries(summary.byCategory).forEach(([k, v]) => { catAgg[k] = (catAgg[k] || 0) + v; });
        Object.entries(summary.byChild).forEach(([k, v]) => { childAgg[k] = (childAgg[k] || 0) + v; });
      });
      setMonthTotals(months);
      setByCategory(catAgg);
      setByChild(childAgg);
      setLoading(false);
    })();
    return () => { cancelled = true; };
  }, [year, subjects]);

  const yearTotal = monthTotals ? monthTotals.reduce((a, b) => a + b, 0) : 0;
  const maxMonth = monthTotals ? Math.max(1, ...monthTotals) : 1;

  return (
    <div style={overlay()}>
      <div onClick={(e) => e.stopPropagation()} style={sheet()}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
          <h2 style={{ margin: 0, fontSize: 16, fontWeight: 700, color: "#20293A" }}>Στατιστικά</h2>
          <button onClick={onClose} style={iconBtn}><X size={18} /></button>
        </div>

        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: "#20293A", color: "#F7F5EF", borderRadius: 10, padding: "8px 12px", margin: "10px 0" }}>
          <button onClick={() => setYear((y) => y - 1)} style={navBtn}><ChevronLeft size={16} /></button>
          <span style={{ fontWeight: 600, fontSize: 14 }}>{year}</span>
          <button onClick={() => setYear((y) => y + 1)} style={navBtn}><ChevronRight size={16} /></button>
        </div>

        {loading ? (
          <p style={{ fontSize: 13, color: "#6B6455" }}>Υπολογισμός…</p>
        ) : (
          <>
            <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", padding: "6px 2px 12px" }}>
              <span style={{ fontSize: 13, color: "#6B6455" }}>Σύνολο έτους</span>
              <span style={{ fontSize: 24, fontWeight: 700, color: "#B5533C", fontVariantNumeric: "tabular-nums" }}>{fmtEUR(yearTotal)}</span>
            </div>

            <div style={{ marginBottom: 16 }}>
              {monthTotals.map((total, m) => (
                <div key={m} style={{ display: "flex", alignItems: "center", gap: 8, padding: "3px 0" }}>
                  <span style={{ width: 34, fontSize: 12, color: "#6B6455" }}>{MONTHS_SHORT[m]}</span>
                  <div style={{ flex: 1, background: "#F1ECDD", borderRadius: 4, height: 10, overflow: "hidden" }}>
                    <div style={{ width: `${(total / maxMonth) * 100}%`, background: "#8A7A57", height: "100%", borderRadius: 4 }} />
                  </div>
                  <span style={{ width: 60, textAlign: "right", fontSize: 12.5, fontVariantNumeric: "tabular-nums", color: "#20293A" }}>{fmtEUR(total)}</span>
                </div>
              ))}
            </div>

            {Object.keys(byCategory).length > 0 && (
              <>
                <div style={{ fontSize: 12, fontWeight: 700, color: "#8A7A57", marginBottom: 6 }}>Ανά κατηγορία</div>
                {Object.entries(byCategory).sort((a, b) => b[1] - a[1]).map(([k, v]) => (
                  <div key={k} style={{ display: "flex", justifyContent: "space-between", fontSize: 13, padding: "3px 0" }}>
                    <span>{k}</span><span style={{ fontVariantNumeric: "tabular-nums" }}>{fmtEUR(v)}</span>
                  </div>
                ))}
              </>
            )}

            {Object.keys(byChild).length > 0 && (
              <>
                <div style={{ fontSize: 12, fontWeight: 700, color: "#8A7A57", margin: "14px 0 6px" }}>Ανά τίτλο</div>
                {Object.entries(byChild).sort((a, b) => b[1] - a[1]).map(([k, v]) => (
                  <div key={k} style={{ display: "flex", justifyContent: "space-between", fontSize: 13, padding: "3px 0" }}>
                    <span>{k}</span><span style={{ fontVariantNumeric: "tabular-nums" }}>{fmtEUR(v)}</span>
                  </div>
                ))}
              </>
            )}
          </>
        )}
      </div>
    </div>
  );
}

function SettleConfirmModal({ target, onCancel, onConfirm }) {
  const isMonth = target.billing === "month";
  const max = target.occurred;
  const [amount, setAmount] = useState(max);
  const clean = Math.min(max, Math.max(0, Number(amount) || 0));
  const remainderAfter = Math.max(0, max - clean);

  return (
    <div style={overlay()}>
      <div onClick={(e) => e.stopPropagation()} style={sheet()}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
          <h2 style={{ margin: 0, fontSize: 16, fontWeight: 700, color: "#20293A" }}>Επιβεβαίωση εξόφλησης</h2>
          <button onClick={onCancel} style={iconBtn}><X size={18} /></button>
        </div>

        <div style={{ background: "#F1ECDD", borderRadius: 10, padding: "14px 16px", marginBottom: 14 }}>
          <div style={{ fontSize: 14, fontWeight: 600, color: "#20293A" }}>
            {target.name}{target.childName && <span style={{ color: "#8A7A57", fontWeight: 500 }}> · {target.childName}</span>}
          </div>
          <div style={{ fontSize: 12.5, color: "#6B6455", marginTop: 4 }}>
            {isMonth
              ? "Σταθερή μηνιαία χρέωση για τον τρέχοντα μήνα."
              : `Οφειλή ${target.occurredCount || ""} μαθήματ${target.occurredCount === 1 ? "ος" : "ων"} που έχ${target.occurredCount === 1 ? "ει" : "ουν"} ήδη γίνει: ${fmtEUR(max)}`}
          </div>
        </div>

        <label style={fieldLabel}>Ποσό που πληρώνεις τώρα (€)</label>
        <input
          type="number" step="0.5" min="0" max={max} value={amount}
          onChange={(e) => setAmount(e.target.value)}
          style={{ ...fieldInput, fontSize: 22, fontWeight: 700, textAlign: "right", color: "#5C7A5F" }}
        />
        <div style={{ display: "flex", justifyContent: "space-between", marginTop: 6, marginBottom: 4 }}>
          <button onClick={() => setAmount(max)} style={{ background: "none", border: "none", color: "#8A7A57", fontSize: 12, fontWeight: 600, cursor: "pointer", padding: 0 }}>
            Ολόκληρο το ποσό ({fmtEUR(max)})
          </button>
          {remainderAfter > 0.005 && (
            <span style={{ fontSize: 12, color: "#9A8F72" }}>Θα μείνει {fmtEUR(remainderAfter)}</span>
          )}
        </div>

        <p style={{ fontSize: 12.5, color: "#9A8F72", margin: "12px 0 16px" }}>
          {isMonth
            ? "Το ποσό αποθηκεύεται ως πληρωμή για το μηνιαίο τέλος. Ό,τι μείνει παραμένει οφειλόμενο."
            : "Το ποσό κατανέμεται στα παλαιότερα μαθήματα πρώτα. Ό,τι μείνει παραμένει οφειλόμενο και μπορείς να το εξοφλήσεις αργότερα."}
        </p>

        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={onCancel} style={{ ...toggleChip, flex: 1 }}>Άκυρο</button>
          <button onClick={() => clean > 0 && onConfirm(clean)} style={{ ...primaryBtn, marginTop: 0, flex: 1 }}>Αποθήκευση</button>
        </div>
      </div>
    </div>
  );
}

function UndoConfirmModal({ target, onCancel, onConfirm }) {
  return (

      <div onClick={(e) => e.stopPropagation()} style={sheet()}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
          <h2 style={{ margin: 0, fontSize: 16, fontWeight: 700, color: "#20293A" }}>Αναίρεση πληρωμής</h2>
          <button onClick={onCancel} style={iconBtn}><X size={18} /></button>

        <div style={{ background: "#F1ECDD", borderRadius: 10, padding: "14px 16px", marginBottom: 14 }}>
          <div style={{ fontSize: 14, fontWeight: 600, color: "#20293A" }}>

          </div>
          <div style={{ fontSize: 26, fontWeight: 700, color: "#5C7A5F", marginTop: 8, fontVariantNumeric: "tabular-nums" }}>{fmtEUR(target.paidTotal)}</div>
        </div>

        <p style={{ fontSize: 12.5, color: "#9A8F72", marginBottom: 16 }}>
          Αυτό το ποσό θα σημειωθεί ξανά ως οφειλόμενο — χρησιμοποίησέ το αν έγινε λάθος στην εξόφληση.
        </p>

        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={onCancel} style={{ ...toggleChip, flex: 1 }}>Άκυρο</button>

}

const root = ReactDOM.createRoot(document.getElementById("root"));

function AuthGate() {
  const [ready, setReady] = React.useState(false);
  const [failed, setFailed] = React.useState(false);

  React.useEffect(() => {
    const unsub = firebase.auth().onAuthStateChanged((user) => {
      if (user) setReady(true);
    });
    firebase.auth().signInAnonymously().catch(() => setFailed(true));
    return unsub;
  }, []);

  if (failed) {
    return (
      <div style={{ padding: 24, fontFamily: "system-ui, sans-serif", color: "#B5533C" }}>
        Η σύνδεση με τη βάση απέτυχε. Έλεγξε ότι το «Anonymous» sign-in είναι ενεργοποιημένο στο Firebase και ότι έχεις σύνδεση internet.
      </div>
    );
  }
  if (!ready) {
    return <div style={{ padding: 24, fontFamily: "system-ui, sans-serif", color: "#6B6455" }}>Σύνδεση…</div>;
  }
  return <TutoringLedger />;
}

root.render(<AuthGate />);
</script>
