const $ = (s) => document.querySelector(s);
const v = $("#v");
let sub = "el", ui = "el";
try { const s = localStorage.getItem("altis-tour-sub"); if (s === "el" || s === "en" || s === "off") { sub = s; if (s !== "off") ui = s; } else if (!/^el/i.test(navigator.language || "")) { sub = "en"; ui = "en"; } } catch (e) { if (!/^el/i.test(navigator.language || "")) { sub = "en"; ui = "en"; } }
const mmss = (t) => { t = Math.max(0, Math.floor(t)); return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); };
const sceneAt = (t) => { let k = 0; D.scenes.forEach((s, i) => { if (t >= s.s - 0.01) k = i; }); return k; };
const cueAt = (t) => D.cues.find((c) => t >= c.s && t < c.e) || null;

function buildChapters() {
  const ol = $("#chapters"); ol.textContent = "";
  D.scenes.forEach((s, i) => {
    const li = document.createElement("li"); const b = document.createElement("button");
    b.type = "button"; b.className = "ch"; b.dataset.i = i;
    b.innerHTML = '<span class="n"></span><span class="t"></span><span class="m"></span>';
    b.querySelector(".n").textContent = String(i + 1).padStart(2, "0");
    b.querySelector(".m").textContent = mmss(s.s);
    b.addEventListener("click", () => { v.currentTime = s.s + 0.05; v.play().catch(() => {}); });
    li.appendChild(b); ol.appendChild(li);
  });
}
function renderStatic() {
  const T = UI[ui];
  document.documentElement.lang = ui;
  document.querySelectorAll("[data-i]").forEach((el) => { if (UI.el[el.dataset.i] !== undefined) el.textContent = T[el.dataset.i]; });
  document.querySelectorAll("[data-ia]").forEach((el) => { const k = el.dataset.ia; el.setAttribute("aria-label", k === "play" ? (v.paused ? T.play : T.pause) : T[k]); });
  ["el", "en", "off"].forEach((k) => $("#b-" + k).setAttribute("aria-pressed", String(sub === k)));
  document.querySelectorAll(".ch").forEach((b) => { b.querySelector(".t").textContent = D.scenes[+b.dataset.i][ui]; });
  document.title = T.title;
}
function tick() {
  const t = v.currentTime || 0, dur = v.duration || D.total;
  const k = sceneAt(t), sc = D.scenes[k], cue = cueAt(t);
  const showSub = sub !== "off";
  const txt = cue && showSub ? cue[sub] : "";
  const tover = $("#tover"); tover.textContent = showSub ? sc[sub] : ""; tover.style.opacity = showSub && t > sc.s + 0.3 && t < sc.e - 0.3 ? 1 : 0;
  const co = $("#cover"); co.hidden = !txt; co.textContent = txt;
  $("#bt").textContent = showSub ? sc[sub] : ""; $("#bp").textContent = txt;
  $("#time").textContent = mmss(t) + " / " + mmss(dur);
  if (!seeking) { $("#seek").max = dur; $("#seek").value = t; }
  document.querySelectorAll(".ch").forEach((b) => b.setAttribute("aria-current", String(+b.dataset.i === k)));
}
let seeking = false, raf = 0;
function loop() { tick(); raf = v.paused ? 0 : requestAnimationFrame(loop); }
function syncPlay() {
  $("#ico-play").hidden = !v.paused; $("#ico-pause").hidden = v.paused;
  $("#big").hidden = !v.paused || v.currentTime > 0.5;
  renderStatic();
  if (!v.paused && !raf) raf = requestAnimationFrame(loop);
}
let vlang = null;
const mqP = window.matchMedia("(max-width: 700px)");
const vmode = () => (mqP.matches ? "v" : "h");
function loadVideo(lang) {
  const key = vmode() + lang;
  if (key === vlang) return;
  const first = vlang === null, t = first ? 0 : (v.currentTime || 0), wasPlaying = !first && !v.paused;
  vlang = key; v.src = "altis-tour-" + (vmode() === "v" ? "v-" : "") + lang + ".mp4";
  v.poster = vmode() === "v" ? "poster_v.jpg" : "poster.jpg";
  $("#stage").classList.toggle("portrait", vmode() === "v");
  if (!first) {
    v.addEventListener("loadedmetadata", function once() { v.removeEventListener("loadedmetadata", once); try { v.currentTime = t; } catch (e) {} if (wasPlaying) v.play().catch(() => {}); });
  }
  v.load();
}
function setSub(s) { sub = s; if (s !== "off") { ui = s; loadVideo(s); } try { localStorage.setItem("altis-tour-sub", s); } catch (e) {} renderStatic(); tick(); }

$("#seg").addEventListener("click", (e) => { const b = e.target.closest("button[data-s]"); if (b) setSub(b.dataset.s); });
const toggle = () => { if (v.paused) v.play().catch(() => {}); else v.pause(); };
$("#pp").addEventListener("click", toggle); $("#big").addEventListener("click", toggle); v.addEventListener("click", toggle);
v.addEventListener("play", syncPlay); v.addEventListener("pause", syncPlay); v.addEventListener("ended", syncPlay);
v.addEventListener("timeupdate", tick); v.addEventListener("loadedmetadata", tick); v.addEventListener("seeked", tick);
$("#seek").addEventListener("input", (e) => { seeking = true; v.currentTime = +e.target.value; tick(); });
$("#seek").addEventListener("change", () => { seeking = false; });
$("#mute").addEventListener("click", () => { v.muted = !v.muted; $("#ico-snd").hidden = v.muted; $("#ico-mut").hidden = !v.muted; });
if (document.fullscreenEnabled) {
  $("#fs").addEventListener("click", () => { const st = $("#stage"); if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); else st.requestFullscreen().catch(() => {}); });
} else { $("#fs").hidden = true; }
document.addEventListener("keydown", (e) => { if (e.code === "Space" && e.target === document.body) { e.preventDefault(); toggle(); } });

mqP.addEventListener && mqP.addEventListener("change", () => loadVideo(ui));
loadVideo(ui); buildChapters(); renderStatic(); syncPlay(); tick();
</script>

</body></html>
