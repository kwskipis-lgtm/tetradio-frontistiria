// ---- demo mode: open with ?demo=1 to preview with anonymous auth + an isolated,
// throwaway data set (same behaviour as the single-family Altis demo). ----
const urlParams = new URLSearchParams(window.location.search);
const IS_DEMO = urlParams.get("demo") === "1";
const DEMO_COLLECTION = "tutoring_data_demo";
window.APP_DEMO_MODE = IS_DEMO;

// ---- Multi-family storage shim ----
// In real (non-demo) mode, each family's data lives at app_families/{FAMILY_CODE}/data/{key},
// isolated from every other family by Firestore security rules (only members of that family
// can read/write it). window.__familyCollectionRef is set once by FamilyGate, after the
// signed-in user's family has been resolved (created or joined) — until then, storage calls
// are simply not made (the UI shows the login/family screen instead).
window.__familyCollectionRef = null;

window.storage = {
  get: async (key) => {
    try {
      const colRef = IS_DEMO ? db.collection(DEMO_COLLECTION) : window.__familyCollectionRef;
      if (!colRef) return null;
      const snap = await colRef.doc(key).get();
      if (!snap.exists) return null;
      return { key, value: snap.data().value, shared: true };
    } catch (e) { console.error("storage.get failed", e); return null; }
  },
  set: async (key, value) => {
    try {
      const colRef = IS_DEMO ? db.collection(DEMO_COLLECTION) : window.__familyCollectionRef;
      if (!colRef) return null;
      await colRef.doc(key).set({ value, updatedAt: Date.now() });
      return { key, value, shared: true };
    } catch (e) { console.error("storage.set failed", e); return null; }
  },
};

function monthKey2(year, monthIdx) { return `${year}-${String(monthIdx + 1).padStart(2, "0")}`; }
function monthKey(d) { return monthKey2(d.getFullYear(), d.getMonth()); }
function fmtEUR(n, lang) { return new Intl.NumberFormat((STRINGS[lang] || STRINGS.el).dateLocale, { style: "currency", currency: "EUR" }).format(n || 0); }
function fmtDateLong(iso, lang) {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString((STRINGS[lang] || STRINGS.el).dateLocale, { weekday: "long", day: "2-digit", month: "long" });
}
function fmtDateShort(iso, lang) {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString((STRINGS[lang] || STRINGS.el).dateLocale, { day: "2-digit", month: "2-digit", year: "numeric" });
}
function uid() { return Math.random().toString(36).slice(2, 10); }
function daysInMonth(year, monthIdx) { return new Date(year, monthIdx + 1, 0).getDate(); }
function pad2(n) { return String(n).padStart(2, "0"); }
function subjectColor(subjects, id) {
  const idx = subjects.findIndex((s) => s.id === id);
  return SUBJECT_COLORS[idx >= 0 ? idx % SUBJECT_COLORS.length : 0];
}

// Pure: build all lesson occurrences for a given year/month from subjects + that month's saved overrides/extras.
// Supports partial payments: each occurrence tracks paidAmount (€ already settled) and remaining (€ still owed).
// Subjects with startDate/endDate only generate occurrences within that range (e.g. mid-month start, no summer lessons).
function generateOccurrences(year, monthIdx, subjects, monthData) {
  const total = daysInMonth(year, monthIdx);
  const list = [];
  const overrides = (monthData && monthData.overrides) || {};
  const extras = (monthData && monthData.extras) || [];

  for (let day = 1; day <= total; day++) {
    const d = new Date(year, monthIdx, day);
    const iso = `${year}-${pad2(monthIdx + 1)}-${pad2(day)}`;
    const wd = d.getDay();
    subjects.forEach((subj) => {
      if (subj.startDate && iso < subj.startDate) return;
      if (subj.endDate && iso > subj.endDate) return;
      (subj.slots || []).forEach((slot) => {
        if (slot.weekday === wd) {
          const ovKey = `${subj.id}_${iso}_${slot.id}`;
          const ov = overrides[ovKey] || {};
          const cost = Number(subj.cost || 0);
          const paidAmount = Number(ov.paidAmount || 0);
          const remaining = Math.max(0, cost - paidAmount);
          list.push({
            key: ovKey, isExtra: false, subjectId: subj.id, billing: subj.billing || "lesson",
            category: subj.category || CATEGORIES[0], childId: subj.childId || null,
            name: subj.name, date: iso, start: slot.start, end: slot.end,
            cost, paidAmount, remaining, paid: remaining <= 0.005, cancelled: !!ov.cancelled,
          });
        }
      });
    });
  }

  extras.forEach((ex) => {
    const cost = Number(ex.cost || 0);
    const paidAmount = Number(ex.paidAmount || 0);
    const remaining = Math.max(0, cost - paidAmount);
    list.push({
      key: ex.id, isExtra: true, subjectId: ex.subjectId || null, billing: "lesson",
      category: ex.category || CATEGORIES[0], childId: ex.childId || null,
      name: ex.name, date: ex.date, start: ex.start, end: ex.end,
      cost, paidAmount, remaining, paid: remaining <= 0.005, comment: ex.comment, cancelled: !!ex.cancelled,
    });
  });

  list.sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start));
  return list;
}

// Unpaid balance carried over from the months BEFORE the viewed month (already-held lessons and
// already-started monthly fees only). Looks back up to CARRY_LOOKBACK months.
// A subject only counts from: its startDate; else the month it was created (createdAt);
// else (older data) the earliest month that has any saved record — so months before the app
// was ever used are never shown as owed.
const REMINDER_OPTIONS = [0, 10, 15, 30, 45, 60, 120, 1440];
function reminderLabel(lang, m) {
  const el = lang === "el";
  if (!m) return el ? "Χωρίς υπενθύμιση" : "No reminder";
  if (m === 1440) return el ? "1 μέρα πριν" : "1 day before";
  if (m >= 60 && m % 60 === 0) {
    const h = m / 60;
    return el ? (h === 1 ? "1 ώρα πριν" : `${h} ώρες πριν`) : (h === 1 ? "1 hour before" : `${h} hours before`);
  }
  return el ? `${m} λεπτά πριν` : `${m} minutes before`;
}

function icsEscape(v) {
  return String(v == null ? "" : v).replace(/\\/g, "\\\\").replace(/;/g, "\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
}
// RFC 5545: lines are folded at 75 octets; continuation lines start with a space.
function icsFold(line) {
  const enc = new TextEncoder();
  let out = "", cur = "", bytes = 0;
  for (const ch of line) {
    const b = enc.encode(ch).length;
    if (bytes + b > 72) { out += cur + "\r\n "; cur = ""; bytes = 0; }
    cur += ch; bytes += b;
  }
  return out + cur;
}
function localISO(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }

// Builds an .ics calendar with the upcoming (non-cancelled) lessons of every subject that has a
// reminder, each with its own alarm lead time. Stable UIDs let calendar apps update, not duplicate.
async function buildRemindersIcs({ subjects, children, lang, days }) {
  const t = STRINGS[lang];
  const byId = {};
  subjects.forEach((sj) => { if (Number(sj.reminderMinutes) > 0) byId[sj.id] = sj; });
  const withRem = Object.values(byId);
  if (withRem.length === 0) return { text: null, count: 0 };

  const start = new Date(); start.setHours(0, 0, 0, 0);
  const end = new Date(start); end.setDate(end.getDate() + days);
  const todayISO = localISO(start), endISO = localISO(end);

  const monthsToLoad = [];
  for (let d = new Date(start.getFullYear(), start.getMonth(), 1); d <= end; d = new Date(d.getFullYear(), d.getMonth() + 1, 1)) {
    monthsToLoad.push({ year: d.getFullYear(), month: d.getMonth() });
  }
  const results = await Promise.all(
    monthsToLoad.map((m) => window.storage.get(`month:${monthKey2(m.year, m.month)}`, true).catch(() => null))
  );
  const stamp = new Date().toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
  const childById = {};
  (children || []).forEach((c) => { childById[c.id] = c.name; });
  const dt = (iso, hm) => iso.replace(/-/g, "") + "T" + hm.replace(":", "") + "00";

  const rows = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Altis//Reminders//EL", "CALSCALE:GREGORIAN", "X-WR-CALNAME:Altis"];
  let count = 0;
  monthsToLoad.forEach((m, i) => {
    let data = { overrides: {}, extras: [], monthlyPayments: {} };
    try { if (results[i] && results[i].value) data = JSON.parse(results[i].value); } catch (e) {}
    generateOccurrences(m.year, m.month, withRem, data)
      .filter((o) => !o.cancelled && o.date >= todayISO && o.date <= endISO && o.subjectId && byId[o.subjectId])
      .forEach((o) => {
        const mins = Number(byId[o.subjectId].reminderMinutes);
        const child = childById[o.childId];
        const summary = o.name + (child ? " · " + child : "");
        rows.push(
          "BEGIN:VEVENT",
          `UID:${o.key}@altis.app`,
          `DTSTAMP:${stamp}`,
          `DTSTART:${dt(o.date, o.start)}`,
          `DTEND:${dt(o.date, o.end)}`,
          `SUMMARY:${icsEscape(summary)}`,
          `DESCRIPTION:${icsEscape(t.remindersEventDesc(mins))}`,
          "BEGIN:VALARM",
          `TRIGGER:-PT${mins}M`,
          "ACTION:DISPLAY",
          `DESCRIPTION:${icsEscape(summary)}`,
          "END:VALARM",
          "END:VEVENT"
        );
        count++;
      });
  });
  rows.push("END:VCALENDAR");
  return { text: rows.map(icsFold).join("\r\n") + "\r\n", count };
}

// Appends a payment record (signed amount: + paid, - reversed) to a month's data.
function addPaymentLog(current, entry) {
  return { ...current, payments: [...(current.payments || []), { id: uid(), ts: Date.now(), ...entry }] };
}

const CARRY_LOOKBACK = 24;
async function computeCarryover({ subjects, cursor, filterChild, filterCategory, todayISO }) {
  const y0 = cursor.getFullYear(), m0 = cursor.getMonth();
  const slots = [];
  for (let i = CARRY_LOOKBACK; i >= 1; i--) {
    const d = new Date(y0, m0 - i, 1);
    slots.push({ year: d.getFullYear(), month: d.getMonth() });
  }
  const results = await Promise.all(
    slots.map((sl) => window.storage.get(`month:${monthKey2(sl.year, sl.month)}`, true).catch(() => null))
  );
  const datas = results.map((r) => { try { return r && r.value ? JSON.parse(r.value) : null; } catch (e) { return null; } });
  const firstDocIdx = datas.findIndex((d) => d);
  const legacyStart = firstDocIdx >= 0 ? `${slots[firstDocIdx].year}-${pad2(slots[firstDocIdx].month + 1)}-01` : null;
  const eff = subjects.map((sj) => {
    if (sj.startDate) return sj;
    if (sj.createdAt) { const d = new Date(sj.createdAt); return { ...sj, startDate: `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-01` }; }
    return { ...sj, startDate: legacyStart || "9999-12-31" };
  });
  const now = new Date();
  const months = [];
  let total = 0;
  slots.forEach((sl, i) => {
    const data = datas[i] || { overrides: {}, extras: [], monthlyPayments: {} };
    const occs = generateOccurrences(sl.year, sl.month, eff, data).filter((o) =>
      (filterChild === "all" || o.childId === filterChild) &&
      (filterCategory === "all" || (o.category || CATEGORIES[0]) === filterCategory)
    );
    const started = sl.year < now.getFullYear() || (sl.year === now.getFullYear() && sl.month <= now.getMonth());
    let owed = 0;
    eff.forEach((sj) => {
      if ((sj.billing || "lesson") !== "month" || !started) return;
      if (!occs.some((o) => o.subjectId === sj.id)) return;
      const cost = Number(sj.cost || 0);
      const paid = Math.min(cost, Number((data.monthlyPayments || {})[sj.id] || 0));
      owed += Math.max(0, cost - paid);
    });
    occs.filter((o) => o.billing !== "month" && !o.cancelled && o.date <= todayISO && o.remaining > 0.005)
      .forEach((o) => { owed += o.remaining; });
    if (owed > 0.005) { months.push({ year: sl.year, month: sl.month, owed }); total += owed; }
  });
  return { total, months };
}

// Total actual cost (non-cancelled) for one month, plus breakdowns — used by statistics.
function monthCostSummary(year, monthIdx, subjects, monthData, childNameFn, lang) {
  const occ = generateOccurrences(year, monthIdx, subjects, monthData);
  let total = 0;
  const byCategory = {};
  const byChild = {};
  const bump = (map, k, v) => { map[k] = (map[k] || 0) + v; };
  const untitled = (STRINGS[lang] || STRINGS.el).untitled;

  subjects.forEach((subj) => {
    if ((subj.billing || "lesson") === "month") {
      const has = occ.some((o) => o.subjectId === subj.id);
      if (has) {
        const v = Number(subj.cost || 0);
        total += v;
        bump(byCategory, catLabel(lang, subj.category || CATEGORIES[0]), v);
        bump(byChild, childNameFn(subj.childId) || untitled, v);
      }
    }
  });
  occ.filter((o) => o.billing !== "month" && !o.cancelled).forEach((o) => {
    const v = Number(o.cost || 0);
    total += v;
    bump(byCategory, catLabel(lang, o.category || CATEGORIES[0]), v);
    bump(byChild, childNameFn(o.childId) || untitled, v);
  });
  return { total, byCategory, byChild };
}

  // settleKey is always o.subjectId (real subjects) or `extra_${name}` (freeform extras) —
  // it must match exactly what settleLessonSubject/resetSubjectPayments filter on.
  const totals = useMemo(() => {
    let owed = 0, paidSum = 0, cancelledCount = 0;
    const bySubject = {};

    subjects.forEach((subj) => {
      if ((subj.billing || "lesson") === "month") {
        const has = filteredOccurrences.some((o) => o.subjectId === subj.id);
        if (!has) return;
        const cost = Number(subj.cost || 0);
        const paidAmount = Math.min(cost, Number((monthData.monthlyPayments || {})[subj.id] || 0));
        const remaining = Math.max(0, cost - paidAmount);
        cancelledCount += filteredOccurrences.filter((o) => o.subjectId === subj.id && o.cancelled).length;
        owed += remaining;
        paidSum += paidAmount;
        bySubject[subj.id] = {
          name: subj.name, childId: subj.childId, billing: "month",
          occurred: remaining > 0.005 && monthStarted ? remaining : 0,
          upcoming: remaining > 0.005 && !monthStarted ? remaining : 0,
          paidTotal: paidAmount,
          settleKey: subj.id,
        };
      }
    });

    filteredOccurrences.filter((o) => o.billing !== "month").forEach((o) => {
      if (o.cancelled) { cancelledCount++; return; }
      paidSum += o.paidAmount;
      const skey = o.subjectId || `extra_${o.name}`;
      if (!bySubject[skey]) bySubject[skey] = { name: o.name, childId: o.childId, billing: "lesson", occurred: 0, upcoming: 0, paidTotal: 0, occurredCount: 0, settleKey: skey };
      bySubject[skey].paidTotal += o.paidAmount;
      if (o.remaining > 0.005) {
        owed += o.remaining;
        if (o.date <= todayISO) { bySubject[skey].occurred += o.remaining; bySubject[skey].occurredCount += 1; }
        else bySubject[skey].upcoming += o.remaining;
      }
    });

    return { owed, paidSum, cancelledCount, bySubject };
  }, [filteredOccurrences, subjects, monthData, todayISO, monthStarted]);

  useEffect(() => {
    let off = false;
    computeCarryover({ subjects, cursor, filterChild, filterCategory, todayISO })
      .then((r) => { if (!off) setCarry(r); })
      .catch(() => {});
    return () => { off = true; };
  }, [key, subjects, filterChild, filterCategory, refreshTick]);

  function toggleField(occ, field) {
    mutateMonth((current) => {
      if (field === "cancelled") {
        if (occ.isExtra) {
          return { ...current, extras: (current.extras || []).map((ex) => (ex.id === occ.key ? { ...ex, cancelled: !ex.cancelled } : ex)) };
        }
        const cur = current.overrides[occ.key] || {};
        return { ...current, overrides: { ...current.overrides, [occ.key]: { ...cur, cancelled: !cur.cancelled } } };
      }
      // field === "paid": any existing payment (partial or full) is removed on click;
      // only when nothing is paid yet does the click mark it fully paid.
      if (occ.isExtra) {
        const ex = (current.extras || []).find((e) => e.id === occ.key);
        const curPaid = ex ? Number(ex.paidAmount || 0) : 0;
        const newAmount = curPaid > 0.005 ? 0 : occ.cost;
        const nextC = { ...current, extras: (current.extras || []).map((e) => (e.id === occ.key ? { ...e, paidAmount: newAmount } : e)) };
        const delta = newAmount - curPaid;
        return Math.abs(delta) > 0.005 ? addPaymentLog(nextC, { amount: delta, kind: delta > 0 ? "pay" : "undo", name: occ.name, childId: occ.childId || null, childName: childName(occ.childId) || "", lessonDate: occ.date }) : nextC;
      }
      const cur = current.overrides[occ.key] || {};
      const curPaid = Number(cur.paidAmount || 0);
      const newAmount = curPaid > 0.005 ? 0 : occ.cost;
      const nextC = { ...current, overrides: { ...current.overrides, [occ.key]: { ...cur, paidAmount: newAmount } } };
      const delta = newAmount - curPaid;
      return Math.abs(delta) > 0.005 ? addPaymentLog(nextC, { amount: delta, kind: delta > 0 ? "pay" : "undo", name: occ.name, childId: occ.childId || null, childName: childName(occ.childId) || "", lessonDate: occ.date }) : nextC;
    });
  }
  function removeExtra(id) {
    mutateMonth((current) => ({ ...current, extras: (current.extras || []).filter((ex) => ex.id !== id) }));
  }
  function addExtra({ name, childId, category, date, start, end, cost, comment }) {
    const entry = { id: uid(), name, childId: childId || null, category: category || CATEGORIES[0], date, start, end, cost: Number(cost), comment: comment || "", cancelled: false, paidAmount: 0 };
    mutateMonth((current) => ({ ...current, extras: [...(current.extras || []), entry] }));
    setShowExtra(false);
  }
  function settleLessonSubject(settleKey, amount) {
    mutateMonth((current) => {
      let remainingToApply = Math.max(0, Number(amount) || 0);
      if (remainingToApply <= 0) return current;
      const occs = generateOccurrences(cursor.getFullYear(), cursor.getMonth(), subjects, current);
      const candidates = occs.filter((o) => o.billing !== "month" && !o.cancelled && o.remaining > 0.005 && o.date <= todayISO && (o.subjectId || `extra_${o.name}`) === settleKey);
      const nextOverrides = { ...current.overrides };
      const nextExtras = (current.extras || []).map((ex) => ({ ...ex }));
      let applied = 0, firstOcc = null;
      for (const o of candidates) {
        if (remainingToApply <= 0.005) break;
        const apply = Math.min(o.remaining, remainingToApply);
        applied += apply; if (!firstOcc) firstOcc = o;
        const newPaidAmount = o.paidAmount + apply;
        if (o.isExtra) {
          const idx = nextExtras.findIndex((ex) => ex.id === o.key);
          if (idx >= 0) nextExtras[idx].paidAmount = newPaidAmount;
        } else {
          nextOverrides[o.key] = { ...(nextOverrides[o.key] || {}), paidAmount: newPaidAmount };
        }
        remainingToApply -= apply;
      }
      const nextC = { ...current, overrides: nextOverrides, extras: nextExtras };
      return applied > 0.005 && firstOcc ? addPaymentLog(nextC, { amount: applied, kind: "pay", name: firstOcc.name, childId: firstOcc.childId || null, childName: childName(firstOcc.childId) || "" }) : nextC;
    });
  }
  function settleMonthSubject(subjectId, amount) {
    mutateMonth((current) => {
      const subj = subjects.find((s) => s.id === subjectId);
      const cap = subj ? Number(subj.cost || 0) : Infinity;
      const cur = Number((current.monthlyPayments || {})[subjectId] || 0);
      const next = Math.min(cap, cur + Math.max(0, Number(amount) || 0));
      const nextC = { ...current, monthlyPayments: { ...(current.monthlyPayments || {}), [subjectId]: next } };
      const delta = next - cur;
      return delta > 0.005 ? addPaymentLog(nextC, { amount: delta, kind: "pay", name: subj ? subj.name : "", childId: subj ? (subj.childId || null) : null, childName: subj ? (childName(subj.childId) || "") : "", monthly: true }) : nextC;
    });
  }
  function resetSubjectPayments(target) {
    mutateMonth((current) => {
      const logUndo = (nextC, total) => (total > 0.005
        ? addPaymentLog(nextC, { amount: -total, kind: "undo", name: target.name, childId: target.childId || null, childName: childName(target.childId) || "" })
        : nextC);
      if (target.billing === "month") {
        const prev = Number((current.monthlyPayments || {})[target.settleKey] || 0);
        return logUndo({ ...current, monthlyPayments: { ...(current.monthlyPayments || {}), [target.settleKey]: 0 } }, prev);
      }
      let undoneTotal = 0;
      const occs = generateOccurrences(cursor.getFullYear(), cursor.getMonth(), subjects, current);
      const nextOverrides = { ...current.overrides };
      const nextExtras = (current.extras || []).map((ex) => ({ ...ex }));
      occs.filter((o) => o.billing !== "month" && (o.subjectId || `extra_${o.name}`) === target.settleKey).forEach((o) => {
        undoneTotal += Number(o.paidAmount || 0);
        if (o.isExtra) {
          const idx = nextExtras.findIndex((ex) => ex.id === o.key);
          if (idx >= 0) nextExtras[idx].paidAmount = 0;
        } else {
          nextOverrides[o.key] = { ...(nextOverrides[o.key] || {}), paidAmount: 0 };
        }
      });
      return logUndo({ ...current, overrides: nextOverrides, extras: nextExtras }, undoneTotal);
    });
  }
  function confirmSettle(amount) {
    if (!settleTarget) return;
    if (settleTarget.billing === "month") settleMonthSubject(settleTarget.settleKey, amount);
    else settleLessonSubject(settleTarget.settleKey, amount);
    setSettleTarget(null);
  }
  function confirmUndo() {
    if (!undoTarget) return;
    resetSubjectPayments(undoTarget);
    setUndoTarget(null);
  }

  function shiftMonth(delta) {
    const d = new Date(cursor);
    d.setMonth(d.getMonth() + delta);
    setCursor(d);
    setActiveDay(null);
  }
  function saveSubject(subj) {
    mutateSubjects((current) => {
      const exists = current.some((s) => s.id === subj.id);
      return exists ? current.map((s) => (s.id === subj.id ? subj : s)) : [...current, subj];
    });
  }
  function deleteSubject(id) {
    mutateSubjects((current) => current.filter((s) => s.id !== id));
  }
  function addChild(name) {
    mutateChildren((current) => [...current, { id: uid(), name }]);
  }
  function deleteChild(id) {
    mutateChildren((current) => current.filter((c) => c.id !== id));
    mutateSubjects((current) => current.map((s) => (s.childId === id ? { ...s, childId: null } : s)));
  }

  const gridCells = useMemo(() => {
    const year = cursor.getFullYear(), monthIdx = cursor.getMonth();
    const first = new Date(year, monthIdx, 1);
    const offset = (first.getDay() + 6) % 7;
    const total = daysInMonth(year, monthIdx);
    const cells = [];
    for (let i = 0; i < offset; i++) cells.push(null);
    for (let d = 1; d <= total; d++) cells.push(`${year}-${pad2(monthIdx + 1)}-${pad2(d)}`);
    while (cells.length % 7 !== 0) cells.push(null);
    return cells;
  }, [cursor]);

  return (
    <div style={{ background: "#F7F5EF", minHeight: "100%", fontFamily: "'Iowan Old Style', 'Georgia', serif", color: "#20293A", padding: "24px 16px 60px" }}>
      <div style={{ maxWidth: 560, margin: "0 auto" }}>
        <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 4 }}>
          <h1 style={{ fontSize: 22, fontWeight: 600, margin: 0, letterSpacing: 0.2 }}>
            {t.appName}
            {typeof window !== "undefined" && window.APP_DEMO_MODE && (
              <span style={{ marginLeft: 8, fontFamily: "system-ui, sans-serif", fontSize: 11, fontWeight: 700, color: "#B5533C", border: "1px solid #B5533C", borderRadius: 5, padding: "2px 6px", verticalAlign: "middle" }}>
                {t.demoBadge}
              </span>
            )}
          </h1>
          <div style={{ display: "flex", alignItems: "center", gap: 2 }}>
            <button onClick={toggleLang} style={{ ...headerIconBtn, fontFamily: "system-ui, sans-serif", fontSize: 12, fontWeight: 700, padding: "4px 8px", border: "1px solid #D8C9A0", borderRadius: 6 }} aria-label="EL/EN">
              {lang === "el" ? "EN" : "ΕΛ"}
            </button>
            <button onClick={refreshAll} style={headerIconBtn} aria-label={t.refresh}><RefreshCw size={18} /></button>
            <button onClick={() => setShowStats(true)} style={headerIconBtn} aria-label={t.stats}><BarChart3 size={18} /></button>
            <button onClick={() => setShowChildren(true)} style={headerIconBtn} aria-label={t.titles}><Users size={18} /></button>
            <button onClick={() => setShowSubjects(true)} style={headerIconBtn} aria-label={t.subjectsBtn}><Settings2 size={18} /></button>
            {typeof window !== "undefined" && window.__account && (
              <button onClick={() => setShowAccount(true)} style={headerIconBtn} aria-label={t.accountBtn}><UserIcon size={18} /></button>
            )}
          </div>
        </div>
        <p style={{ fontFamily: "system-ui, sans-serif", fontSize: 13, color: "#6B6455", margin: "0 0 4px" }}>
          {t.tagline}
        </p>
        <p style={{ fontFamily: "system-ui, sans-serif", fontSize: 13, color: "#6B6455", margin: "0 0 20px" }}>
          {t.subtitle}
        </p>

        <div style={monthNavStyle}>
          <button onClick={() => shiftMonth(-1)} style={navBtn} aria-label={t.prevMonth}><ChevronLeft size={18} /></button>
          <div style={{ fontFamily: "system-ui, sans-serif", fontWeight: 600, fontSize: 15 }}>{label}</div>
          <button onClick={() => shiftMonth(1)} style={navBtn} aria-label={t.nextMonth}><ChevronRight size={18} /></button>
        </div>

        {(children.length > 0 || subjects.length > 0) && (
          <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
            {children.length > 0 && (
              <select value={filterChild} onChange={(e) => setFilterChild(e.target.value)} style={{ ...filterSelect, flex: 1 }}>
                <option value="all">{t.allTitles}</option>
                {children.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
            )}
            <select value={filterCategory} onChange={(e) => setFilterCategory(e.target.value)} style={{ ...filterSelect, flex: 1 }}>
              <option value="all">{t.allCategories}</option>
              {CATEGORIES.map((c) => <option key={c} value={c}>{catLabel(lang, c)}</option>)}
            </select>
          </div>
        )}

        <div style={totalsCard}>
          <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between" }}>
            <span style={{ fontFamily: "system-ui, sans-serif", fontSize: 13, color: "#6B6455" }}>{t.monthTotalDue}</span>
            <span style={{ fontSize: 30, fontWeight: 700, color: "#B5533C", fontVariantNumeric: "tabular-nums" }}>{fmtEUR(totals.owed, lang)}</span>
          </div>
          {carry.total > 0.005 && (
            <div style={{ marginTop: 10, paddingTop: 10, borderTop: "1px dashed #E4DECC", fontFamily: "system-ui, sans-serif" }}>
              <button onClick={() => setShowCarry((v) => !v)} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between", background: "none", border: "none", padding: "2px 0", cursor: "pointer", fontSize: 13, color: "#20293A", fontFamily: "inherit" }}>
                <span>{t.carryLabel} <span style={{ color: "#9A8F72", fontSize: 11 }}>{showCarry ? "▲" : "▼"}</span></span>
                <span style={{ fontWeight: 700, color: "#B5533C", fontVariantNumeric: "tabular-nums" }}>{fmtEUR(carry.total, lang)}</span>
              </button>
              {showCarry && (
                <div style={{ margin: "6px 0 4px", padding: "4px 8px", background: "#F7F5EF", borderRadius: 8 }}>
                  {carry.months.map((m) => (
                    <button key={`${m.year}-${m.month}`} onClick={() => { setCursor(new Date(m.year, m.month, 1)); setShowCarry(false); }}
                      style={{ width: "100%", display: "flex", justifyContent: "space-between", background: "none", border: "none", borderBottom: "1px solid #EFEAD9", padding: "7px 0", cursor: "pointer", fontSize: 12.5, color: "#20293A", fontFamily: "inherit" }}>
                      <span>{MONTHS[lang][m.month]} {m.year}</span>
                      <span style={{ fontVariantNumeric: "tabular-nums" }}>{fmtEUR(m.owed, lang)}</span>
                    </button>
                  ))}
                  <p style={{ fontSize: 11.5, color: "#9A8F72", margin: "6px 0 2px" }}>{t.carryHint}</p>
                </div>
              )}
              <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginTop: 8, paddingTop: 8, borderTop: "1px solid #E4DECC" }}>
                <span style={{ fontSize: 13, fontWeight: 700 }}>{t.grandTotalLabel}</span>
                <span style={{ fontSize: 20, fontWeight: 700, color: "#B5533C", fontVariantNumeric: "tabular-nums" }}>{fmtEUR(totals.owed + carry.total, lang)}</span>
              </div>
            </div>
          )}
          {Object.keys(totals.bySubject).length > 0 && (
            <div style={{ marginTop: 10, paddingTop: 10, borderTop: "1px dashed #E4DECC" }}>
              {Object.values(totals.bySubject).map((b) => {
                const cname = childName(b.childId);
                return (
                  <div key={b.settleKey} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "4px 0", fontFamily: "system-ui, sans-serif", fontSize: 13 }}>
                    <span style={{ color: "#20293A" }}>
                      {b.name}
                      {cname && <span style={{ color: "#9A8F72", fontSize: 11.5 }}> · {cname}</span>}
                      {b.billing === "month" && <span style={{ color: "#9A8F72", fontSize: 11.5 }}> · {t.monthlySuffix}</span>}
                      {b.upcoming > 0 && <span style={{ color: "#9A8F72", fontSize: 11.5 }}> · {t.upcomingPrefix} {fmtEUR(b.upcoming, lang)}</span>}
                    </span>
                    <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                      {b.occurred > 0 && (
                        <button onClick={() => setSettleTarget({ ...b, childName: cname })} style={settleBtn} title={t.settleTooltip}>
                          {fmtEUR(b.occurred, lang)} <CheckCircle2 size={13} />
                        </button>
                      )}
                      {b.paidTotal > 0.005 && (
                        <button onClick={() => setUndoTarget({ ...b, childName: cname })} style={{ ...settleBtn, background: "#EAF1EA", color: "#5C7A5F" }} title={t.undoTooltip}>
                          {fmtEUR(b.paidTotal, lang)} <Undo2 size={13} />
                        </button>
                      )}
                      {b.occurred <= 0 && b.paidTotal <= 0.005 && (
                        <span style={{ color: "#9A8F72", fontSize: 12.5 }}>—</span>
                      )}
                    </div>
                  </div>
                );
              })}
              <div style={{ display: "flex", gap: 16, marginTop: 6, fontFamily: "system-ui, sans-serif", fontSize: 12.5, color: "#6B6455" }}>
                {totals.paidSum > 0 && <span>{t.paidSoFar}: {fmtEUR(totals.paidSum, lang)}</span>}
                {totals.cancelledCount > 0 && <span>{t.cancelledLabel}: {totals.cancelledCount}</span>}
              </div>
            </div>
          )}
        </div>

        <div style={{ marginBottom: 14, display: "flex", gap: 8 }}>
          <button onClick={() => setShowExtra(true)} style={{ ...addBtn, flex: 1, background: "#fff", color: "#8A7A57", border: "1px solid #D8C9A0" }}>
            <Plus size={15} /> {t.extraActivity}
          </button>
          <button onClick={() => setShowHistory(true)} style={{ ...addBtn, flex: 1, background: "#fff", color: "#8A7A57", border: "1px solid #D8C9A0" }}>
            {t.historyBtn}
          </button>
        </div>

        {loading ? (
          <p style={{ fontFamily: "system-ui, sans-serif", fontSize: 13, color: "#6B6455" }}>{t.loading}</p>
        ) : (
          <>
            {subjects.length === 0 && (
              <div style={welcomeCard}>
                <h2 style={{ margin: "0 0 6px", fontSize: 17, fontWeight: 700, color: "#20293A" }}>{t.welcomeTitle}</h2>
                <p style={{ margin: "0 0 12px", fontFamily: "system-ui, sans-serif", fontSize: 13.5, color: "#6B6455", lineHeight: 1.55 }}>{t.welcomeIntro}</p>
                {[t.welcomeStep1, t.welcomeStep2].map((txt, i) => (
                  <div key={i} style={{ display: "flex", alignItems: "flex-start", gap: 10, marginBottom: 8, fontFamily: "system-ui, sans-serif", fontSize: 13.5, color: "#20293A" }}>
                    <span style={{ flexShrink: 0, width: 22, height: 22, borderRadius: "50%", background: "#20293A", color: "#F7F5EF", fontSize: 12, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center" }}>{i + 1}</span>
                    <span style={{ paddingTop: 2 }}>{txt}</span>
                  </div>
                ))}
                <p style={{ margin: "10px 0 14px", fontFamily: "system-ui, sans-serif", fontSize: 12.5, color: "#9A8F72", lineHeight: 1.55 }}>{t.welcomeAfter}</p>
                <button onClick={() => setShowSubjects(true)} style={{ ...primaryBtn, marginTop: 0 }}>{t.welcomeStart}</button>
              </div>
            )}
            <div style={{ background: "#FFFFFF", border: "1px solid #E4DECC", borderRadius: 10, padding: 8, marginBottom: 8 }}>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)" }}>
                {WEEKDAYS_GRID[lang].map((w) => (
                  <div key={w} style={{ fontFamily: "system-ui, sans-serif", fontSize: 10.5, color: "#9A8F72", textAlign: "center", padding: "4px 0" }}>{w}</div>
                ))}
                {gridCells.map((iso, i) => {
                  if (!iso) return <div key={i} />;
                  const occs = byDate.get(iso) || [];
                  const isToday = iso === todayISO;
                  const dayNum = Number(iso.slice(-2));
                  const shown = occs.slice(0, 4);
                  const extra = occs.length - shown.length;
                  return (
                    <button
                      key={iso}
                      onClick={() => occs.length > 0 && setActiveDay(iso)}
                      style={{
                        border: "1px solid #EFEAD9", borderRadius: 6, minHeight: 46, padding: "3px 2px",
                        background: isToday ? "#F1ECDD" : "transparent", cursor: occs.length ? "pointer" : "default",
                        display: "flex", flexDirection: "column", alignItems: "center", gap: 3,
                      }}
                    >
                      <span style={{ fontFamily: "system-ui, sans-serif", fontSize: 11.5, fontWeight: isToday ? 700 : 500, color: isToday ? "#B5533C" : "#20293A" }}>{dayNum}</span>
                      <div style={{ display: "flex", gap: 2, flexWrap: "wrap", justifyContent: "center", minHeight: 6 }}>
                        {shown.map((o) => (
                          <span key={o.key} style={{ width: 6, height: 6, borderRadius: "50%", background: o.cancelled ? "transparent" : subjectColor(subjects, o.subjectId), border: o.cancelled ? `1px solid ${subjectColor(subjects, o.subjectId)}` : "none" }} />
                        ))}
                        {extra > 0 && <span style={{ fontSize: 8, color: "#9A8F72" }}>+{extra}</span>}
                      </div>
                    </button>
                  );
                })}
              </div>
            </div>

            {legendSubjects.length > 0 && (
              <div style={{ display: "flex", flexWrap: "wrap", gap: "6px 14px", padding: "2px 4px 6px", fontFamily: "system-ui, sans-serif", fontSize: 12, color: "#6B6455" }}>
                {legendSubjects.map((s) => (
                  <span key={s.id} style={{ display: "flex", alignItems: "center", gap: 5 }}>
                    <span style={{ width: 8, height: 8, borderRadius: "50%", background: subjectColor(subjects, s.id), flexShrink: 0 }} />
                    {s.name}{childName(s.childId) && ` · ${childName(s.childId)}`}
                  </span>
                ))}
              </div>
            )}
            {subjects.length > 0 && (
              <p style={{ fontFamily: "system-ui, sans-serif", fontSize: 11.5, color: "#9A8F72", padding: "0 4px 16px" }}>
                {t.tapHint}
              </p>
            )}
          </>
        )}

        {error && <p style={{ fontFamily: "system-ui, sans-serif", fontSize: 12, color: "#B5533C", marginTop: 12 }}>{error}</p>}
      </div>

      {activeDay && (
        <DayDetailModal lang={lang} date={activeDay} occs={byDate.get(activeDay) || []} subjects={subjects} childName={childName} onClose={() => setActiveDay(null)} onToggle={toggleField} onRemove={removeExtra} />
      )}
      {showSubjects && (
        <SubjectsModal lang={lang} subjects={subjects} children={children} onClose={() => setShowSubjects(false)} onSave={saveSubject} onDelete={deleteSubject} onAddChild={addChild} />
      )}
      {showChildren && (
        <ChildrenModal lang={lang} children={children} onClose={() => setShowChildren(false)} onAdd={addChild} onDelete={deleteChild} />
      )}
      {showExtra && (
        <ExtraLessonModal lang={lang} subjects={subjects} children={children} onClose={() => setShowExtra(false)} onSave={addExtra} />
      )}
      {showAccount && (
        <AccountModal lang={lang} onClose={() => setShowAccount(false)} />
      )}
      {showHistory && (
        <PaymentHistoryModal lang={lang} initialYear={cursor.getFullYear()} onClose={() => setShowHistory(false)} />
      )}
      {showStats && (
        <StatsModal lang={lang} subjects={subjects} childName={childName} initialYear={cursor.getFullYear()} onClose={() => setShowStats(false)} />
      )}
      {settleTarget && (
        <SettleConfirmModal lang={lang} target={settleTarget} onCancel={() => setSettleTarget(null)} onConfirm={confirmSettle} />
      )}
      {undoTarget && (
        <UndoConfirmModal lang={lang} target={undoTarget} onCancel={() => setUndoTarget(null)} onConfirm={confirmUndo} />
      )}
    </div>
  );
}

function PaymentHistoryModal({ lang, initialYear, onClose }) {
  const t = STRINGS[lang];
  const [year, setYear] = useState(initialYear);
  const [rows, setRows] = useState(null);

  useEffect(() => {
    let off = false;
    setRows(null);
    (async () => {
      const results = await Promise.all(
        Array.from({ length: 12 }, (_, m) => window.storage.get(`month:${monthKey2(year, m)}`, true).catch(() => null))
      );
      if (off) return;
      const all = [];
      results.forEach((res, m) => {
        let data = null;
        try { data = res && res.value ? JSON.parse(res.value) : null; } catch (e) {}
        ((data && data.payments) || []).forEach((p) => all.push({ ...p, monthKey: monthKey2(year, m) }));
      });
      all.sort((a, b) => b.ts - a.ts);
      setRows(all);
    })();
    return () => { off = true; };
  }, [year]);

  const net = rows ? rows.reduce((a, p) => a + Number(p.amount || 0), 0) : 0;
  function fmtTs(ts) {
    const d = new Date(ts);
    return d.toLocaleDateString(t.dateLocale, { day: "2-digit", month: "2-digit", year: "numeric" }) + " " + d.toLocaleTimeString(t.dateLocale, { hour: "2-digit", minute: "2-digit" });
  }
  function exportCsv() {
    if (!rows || rows.length === 0) return;
    const esc = (v) => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
    const head = [t.csvDate, t.csvChild, t.csvActivity, t.csvAmount, t.csvType, t.csvForMonth, t.csvLessonDate];
    const lines = [head.map(esc).join(";")];
    rows.slice().reverse().forEach((p) => {
      lines.push([
        fmtTs(p.ts), p.childName || "", p.name || "",
        Number(p.amount || 0).toFixed(2).replace(".", ","),
        p.kind === "undo" ? t.csvUndo : t.csvPay, p.monthKey, p.lessonDate || "",
      ].map(esc).join(";"));
    });
    const blob = new Blob(["\uFEFF" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `altis-payments-${year}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }

  return (
    <div style={overlay()}>
      <div onClick={(e) => e.stopPropagation()} style={sheet()}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
          <h2 style={{ margin: 0, fontSize: 16, fontWeight: 700, color: "#20293A" }}>{t.historyHeader}</h2>
          <button onClick={onClose} style={iconBtn}><X size={18} /></button>
        </div>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: "#20293A", color: "#F7F5EF", borderRadius: 10, padding: "8px 12px", margin: "10px 0" }}>
          <button onClick={() => setYear((y) => y - 1)} style={navBtn}><ChevronLeft size={16} /></button>
          <span style={{ fontWeight: 600, fontSize: 14 }}>{year}</span>
          <button onClick={() => setYear((y) => y + 1)} style={navBtn}><ChevronRight size={16} /></button>
        </div>
        {rows === null ? (
          <p style={{ fontSize: 13, color: "#6B6455" }}>{t.loading}</p>
        ) : rows.length === 0 ? (
          <p style={{ fontSize: 13, color: "#9A8F72", margin: "8px 0 4px" }}>{t.historyEmpty}</p>
        ) : (
          <>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 6 }}>
              <span style={{ fontSize: 12.5, color: "#6B6455" }}>{t.netPaid}</span>
              <span style={{ fontSize: 18, fontWeight: 700, color: "#5C7A5F" }}>{fmtEUR(net, lang)}</span>
            </div>
            {rows.map((p) => (
              <div key={p.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "9px 2px", borderBottom: "1px solid #E9E3D2" }}>
                <div style={{ minWidth: 0 }}>
                  <div style={{ fontSize: 13.5, fontWeight: 600 }}>
                    {p.name}{p.childName ? <span style={{ color: "#9A8F72", fontWeight: 400 }}> · {p.childName}</span> : null}
                  </div>
                  <div style={{ fontSize: 11.5, color: "#9A8F72" }}>
                    {fmtTs(p.ts)}{p.kind === "undo" ? ` · ${t.reversalTag}` : ""}
                  </div>
                </div>
                <div style={{ fontSize: 14, fontWeight: 700, fontVariantNumeric: "tabular-nums", color: p.kind === "undo" ? "#B5533C" : "#5C7A5F" }}>
                  {Number(p.amount) > 0 ? "+" : "\u2212"}{fmtEUR(Math.abs(Number(p.amount)), lang)}
                </div>
              </div>
            ))}
            <button onClick={exportCsv} style={{ ...primaryBtn, marginTop: 14 }}>{t.exportCsv}</button>
          </>
        )}
        <p style={{ fontSize: 11.5, color: "#9A8F72", margin: "10px 0 0" }}>{t.historyNote}</p>
      </div>
    </div>
  );
}

function AccountModal({ lang, onClose }) {
  const t = STRINGS[lang];
  const acc = (typeof window !== "undefined" && window.__account) || {};
  const [copied, setCopied] = useState(false);
  const [delStep, setDelStep] = useState(0); // 0 = hidden, 1 = confirm form
  const [delShared, setDelShared] = useState(false);
  const [delPw, setDelPw] = useState("");
  const [delBusy, setDelBusy] = useState(false);
  const [delErr, setDelErr] = useState("");

  async function openDelete() {
    setDelErr("");
    try {
      const snap = await db.collection("app_families").doc(acc.familyId).get();
      const members = (snap.exists && snap.data().members) || [];
      setDelShared(members.length > 1);
    } catch (e) { setDelShared(false); }
    setDelStep(1);
  }
  async function doDelete() {
    if (!delPw) { setDelErr(t.deletePasswordLabel); return; }
    setDelErr(""); setDelBusy(true);
    try {
      const u = firebase.auth().currentUser;
      const cred = firebase.auth.EmailAuthProvider.credential(u.email, delPw);
      await u.reauthenticateWithCredential(cred);
      const famRef = db.collection("app_families").doc(acc.familyId);
      const famSnap = await famRef.get();
      const members = (famSnap.exists && famSnap.data().members) || [];
      const others = members.filter((m) => m !== u.uid);
      if (others.length === 0) {
        const dataSnap = await famRef.collection("data").get();
        const docs = dataSnap.docs;
        for (let i = 0; i < docs.length; i += 400) {
          const batch = db.batch();
          docs.slice(i, i + 400).forEach((d) => batch.delete(d.ref));
          await batch.commit();
        }
        await famRef.delete();
      } else {
        await famRef.update({ members: firebase.firestore.FieldValue.arrayRemove(u.uid) });
      }
      await db.collection("app_users").doc(u.uid).delete();
      await u.delete();
    } catch (e) {
      console.error(e);
      setDelErr(e && (e.code === "auth/wrong-password" || e.code === "auth/invalid-credential") ? t.deleteWrongPw : t.deleteFailed);
      setDelBusy(false);
    }
  }
  function copy() {
    try { navigator.clipboard.writeText(acc.familyId || ""); setCopied(true); setTimeout(() => setCopied(false), 1800); } catch (e) {}
  }
  return (
    <div style={overlay()}>
      <div onClick={(e) => e.stopPropagation()} style={sheet()}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
          <h2 style={{ margin: 0, fontSize: 16, fontWeight: 700, color: "#20293A" }}>{t.accountTitle}</h2>
          <button onClick={onClose} style={iconBtn}><X size={18} /></button>
        </div>
        <p style={{ fontSize: 12, color: "#6B6455", margin: "0 0 2px" }}>{t.signedInAs}</p>
        <p style={{ fontSize: 14, fontWeight: 600, margin: "0 0 16px", wordBreak: "break-all" }}>{acc.email}</p>
        <p style={{ fontSize: 12, color: "#6B6455", margin: "0 0 6px", fontWeight: 600 }}>{t.familyCodeLabel}</p>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
          <div style={{ flex: 1, background: "#F1ECDD", borderRadius: 8, padding: "12px 0", textAlign: "center", fontSize: 22, fontWeight: 700, letterSpacing: 3 }}>{acc.familyId}</div>
          <button onClick={copy} style={{ ...toggleChip, flex: "none", padding: "12px 14px" }}>{copied ? t.copiedCode : t.copyCode}</button>
        </div>
        <p style={{ fontSize: 12, color: "#9A8F72", margin: "0 0 14px", lineHeight: 1.5 }}>{t.familyCodeHelp}</p>
        <p style={{ fontSize: 12, color: "#5C7A5F", margin: "0 0 18px" }}>{t.privacyNote}</p>
        <button onClick={() => acc.signOut && acc.signOut()} style={{ ...primaryBtn, background: "#fff", color: "#20293A", border: "1px solid #DDD6C8" }}>{t.signOut}</button>
        {delStep === 0 ? (
          <button onClick={openDelete} style={{ ...primaryBtn, background: "none", color: "#B5533C", border: "none", fontSize: 13, marginTop: 14 }}>{t.deleteAccount}</button>
        ) : (
          <div style={{ marginTop: 18, paddingTop: 14, borderTop: "1px solid #E4DECC" }}>
            <p style={{ fontSize: 12.5, color: "#B5533C", margin: "0 0 10px", lineHeight: 1.5 }}>{delShared ? t.deleteWarnShared : t.deleteWarnSole}</p>
            <label style={{ ...fieldLabel, marginTop: 0 }}>{t.deletePasswordLabel}</label>
            <input type="password" value={delPw} onChange={(e) => setDelPw(e.target.value)} style={fieldInput} autoComplete="current-password" />
            {delErr && <p style={{ fontSize: 12.5, color: "#B5533C", margin: "8px 0 0" }}>{delErr}</p>}
            <button onClick={doDelete} disabled={delBusy} style={{ ...primaryBtn, background: "#B5533C", opacity: delBusy ? 0.6 : 1 }}>{delBusy ? t.deleteBusy : t.deleteConfirmBtn}</button>
          </div>
        )}
      </div>
    </div>
  );
}

      const { text, count } = await buildRemindersIcs({ subjects, children, lang, days: 56 });

function StatsModal({ lang, subjects, childName, initialYear, onClose }) {
  const t = STRINGS[lang];
  const [year, setYear] = useState(initialYear);
  const [monthTotals, setMonthTotals] = useState(null); // array of 12 {total}
  const [byCategory, setByCategory] = useState({});
  const [byChild, setByChild] = useState({});
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    let cancelled = false;
    setLoading(true);
    (async () => {
      const results = await Promise.all(
        Array.from({ length: 12 }, (_, m) =>
          window.storage.get(`month:${monthKey2(year, m)}`, true).catch(() => null)
        )
      );
      if (cancelled) return;
      const months = [];
      const catAgg = {};
      const childAgg = {};
      results.forEach((res, m) => {
        const data = res && res.value ? JSON.parse(res.value) : { overrides: {}, extras: [], monthlyPayments: {} };
        const summary = monthCostSummary(year, m, subjects, data, childName, lang);
        months.push(summary.total);
        Object.entries(summary.byCategory).forEach(([k, v]) => { catAgg[k] = (catAgg[k] || 0) + v; });
        Object.entries(summary.byChild).forEach(([k, v]) => { childAgg[k] = (childAgg[k] || 0) + v; });
      });
      setMonthTotals(months);
      setByCategory(catAgg);
      setByChild(childAgg);
      setLoading(false);
    })();
    return () => { cancelled = true; };
  }, [year, subjects, lang]);

  const yearTotal = monthTotals ? monthTotals.reduce((a, b) => a + b, 0) : 0;
  const maxMonth = monthTotals ? Math.max(1, ...monthTotals) : 1;

  return (
    <div style={overlay()}>
      <div onClick={(e) => e.stopPropagation()} style={sheet()}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
          <h2 style={{ margin: 0, fontSize: 16, fontWeight: 700, color: "#20293A" }}>{t.statsHeader}</h2>
          <button onClick={onClose} style={iconBtn}><X size={18} /></button>
        </div>

        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: "#20293A", color: "#F7F5EF", borderRadius: 10, padding: "8px 12px", margin: "10px 0" }}>
          <button onClick={() => setYear((y) => y - 1)} style={navBtn}><ChevronLeft size={16} /></button>
          <span style={{ fontWeight: 600, fontSize: 14 }}>{year}</span>
          <button onClick={() => setYear((y) => y + 1)} style={navBtn}><ChevronRight size={16} /></button>
        </div>

        {loading ? (
          <p style={{ fontSize: 13, color: "#6B6455" }}>{t.calculating}</p>
        ) : (
          <>
            <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", padding: "6px 2px 12px" }}>
              <span style={{ fontSize: 13, color: "#6B6455" }}>{t.yearTotal}</span>
              <span style={{ fontSize: 24, fontWeight: 700, color: "#B5533C", fontVariantNumeric: "tabular-nums" }}>{fmtEUR(yearTotal, lang)}</span>
            </div>

            <div style={{ marginBottom: 16 }}>
              {monthTotals.map((total, m) => (
                <div key={m} style={{ display: "flex", alignItems: "center", gap: 8, padding: "3px 0" }}>
                  <span style={{ width: 34, fontSize: 12, color: "#6B6455" }}>{MONTHS_SHORT[lang][m]}</span>
                  <div style={{ flex: 1, background: "#F1ECDD", borderRadius: 4, height: 10, overflow: "hidden" }}>
                    <div style={{ width: `${(total / maxMonth) * 100}%`, background: "#8A7A57", height: "100%", borderRadius: 4 }} />
                  </div>
                  <span style={{ width: 60, textAlign: "right", fontSize: 12.5, fontVariantNumeric: "tabular-nums", color: "#20293A" }}>{fmtEUR(total, lang)}</span>
                </div>
              ))}
            </div>

            {Object.keys(byCategory).length > 0 && (
              <>
                <div style={{ fontSize: 12, fontWeight: 700, color: "#8A7A57", marginBottom: 6 }}>{t.byCategory}</div>
                {Object.entries(byCategory).sort((a, b) => b[1] - a[1]).map(([k, v]) => (
                  <div key={k} style={{ display: "flex", justifyContent: "space-between", fontSize: 13, padding: "3px 0" }}>
                    <span>{k}</span><span style={{ fontVariantNumeric: "tabular-nums" }}>{fmtEUR(v, lang)}</span>
                  </div>
                ))}
              </>
            )}

            {Object.keys(byChild).length > 0 && (
              <>
                <div style={{ fontSize: 12, fontWeight: 700, color: "#8A7A57", margin: "14px 0 6px" }}>{t.byTitle}</div>
                {Object.entries(byChild).sort((a, b) => b[1] - a[1]).map(([k, v]) => (
                  <div key={k} style={{ display: "flex", justifyContent: "space-between", fontSize: 13, padding: "3px 0" }}>
                    <span>{k}</span><span style={{ fontVariantNumeric: "tabular-nums" }}>{fmtEUR(v, lang)}</span>
                  </div>
                ))}
              </>
            )}
          </>
        )}
      </div>
    </div>
  );
}

          </div>
          <div style={{ fontSize: 12.5, color: "#6B6455", marginTop: 4 }}>

        <p style={{ fontSize: 12.5, color: "#9A8F72", margin: "12px 0 16px" }}>

        <div style={{ display: "flex", gap: 8 }}>

          <button onClick={() => clean > 0 && onConfirm(clean)} style={{ ...primaryBtn, marginTop: 0, flex: 1 }}>{t.save}</button>
        </div>
      </div>
    </div>
  );

const authInput = { width: "100%", boxSizing: "border-box", border: "1px solid #DDD6C8", borderRadius: 8, padding: "11px 12px", fontSize: 14, fontFamily: "system-ui, sans-serif", background: "#fff", color: "#20293A", marginBottom: 10 };
const authBtn = { width: "100%", background: "#20293A", color: "#F7F5EF", border: "none", borderRadius: 8, padding: "12px 0", fontWeight: 600, fontSize: 14, cursor: "pointer", fontFamily: "system-ui, sans-serif" };
const authBtnSecondary = { ...authBtn, background: "#fff", color: "#20293A", border: "1px solid #DDD6C8" };
const authLink = { background: "none", border: "none", color: "#8A7A57", fontSize: 13, fontWeight: 600, cursor: "pointer", padding: 0, fontFamily: "system-ui, sans-serif" };
const authError = { fontSize: 13, color: "#B5533C", margin: "0 0 12px", fontFamily: "system-ui, sans-serif" };

function friendlyAuthError(code) {
  const map = {
    "auth/invalid-email": "Το email δεν φαίνεται έγκυρο.",
    "auth/email-already-in-use": "Υπάρχει ήδη λογαριασμός με αυτό το email.",
    "auth/weak-password": "Ο κωδικός πρέπει να έχει τουλάχιστον 6 χαρακτήρες.",
    "auth/wrong-password": "Λάθος κωδικός.",
    "auth/user-not-found": "Δεν βρέθηκε λογαριασμός με αυτό το email.",
    "auth/invalid-credential": "Λάθος email ή κωδικός.",
    "auth/too-many-requests": "Πολλές αποτυχημένες προσπάθειες. Δοκίμασε ξανά σε λίγο.",
  };
  return map[code] || "Κάτι πήγε στραβά. Δοκίμασε ξανά.";
}

// Generates a short, human-friendly family invite code (avoids visually-confusing characters).
function generateFamilyCode() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code = "";
  for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return code;
}

function LoginScreen() {
  const [mode, setMode] = useState("login"); // "login" | "register" | "forgot"
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  const [resetSent, setResetSent] = useState(false);

  async function submit() {
    setError("");
    if (!email.trim() || !password) { setError("Συμπλήρωσε email και κωδικό."); return; }
    setBusy(true);
    try {
      if (mode === "login") {
        await firebase.auth().signInWithEmailAndPassword(email.trim(), password);
      } else {
        await firebase.auth().createUserWithEmailAndPassword(email.trim(), password);
      }
    } catch (e) {
      setError(friendlyAuthError(e.code));
    }
    setBusy(false);
  }

  async function submitReset() {
    setError("");
    if (!email.trim()) { setError("Γράψε πρώτα το email σου."); return; }
    setBusy(true);
    try {
      await firebase.auth().sendPasswordResetEmail(email.trim());
      setResetSent(true);
    } catch (e) {
      setError(friendlyAuthError(e.code));
    }
    setBusy(false);
  }

  if (mode === "forgot") {
    return (
      <div style={authWrap}>
        <div style={authCard}>
          <h1 style={authTitle}>Επαναφορά κωδικού</h1>
          {resetSent ? (
            <>
              <p style={authSubtitle}>Αν υπάρχει λογαριασμός με αυτό το email, σου στείλαμε ένα μήνυμα με σύνδεσμο για να φτιάξεις νέο κωδικό. Έλεγξε και τα Ανεπιθύμητα/Spam.</p>
              <button style={authBtn} onClick={() => { setMode("login"); setResetSent(false); setError(""); }}>Πίσω στη σύνδεση</button>
            </>
          ) : (
            <>
              <p style={authSubtitle}>Γράψε το email του λογαριασμού σου και θα σου στείλουμε σύνδεσμο για νέο κωδικό.</p>
              {error && <p style={authError}>{error}</p>}
              <input type="email" placeholder="Email" value={email} onChange={(e) => setEmail(e.target.value)} style={authInput} autoCapitalize="none" onKeyDown={(e) => e.key === "Enter" && submitReset()} />
              <button onClick={submitReset} disabled={busy} style={{ ...authBtn, opacity: busy ? 0.6 : 1, marginBottom: 10 }}>{busy ? "…" : "Αποστολή συνδέσμου"}</button>
              <div style={{ textAlign: "center" }}>
                <button style={authLink} onClick={() => { setMode("login"); setError(""); }}>Πίσω</button>
              </div>
            </>
          )}
        </div>
      </div>
    );
  }

  return (
    <div style={authWrap}>
      <div style={authCard}>
        <h1 style={authTitle}>Altis</h1>
        <p style={authSubtitle}>{mode === "login" ? "Σύνδεση στον λογαριασμό σου" : "Δημιουργία λογαριασμού"}</p>
        {error && <p style={authError}>{error}</p>}
        <input type="email" placeholder="Email" value={email} onChange={(e) => setEmail(e.target.value)} style={authInput} autoCapitalize="none" />
        <input type="password" placeholder="Κωδικός" value={password} onChange={(e) => setPassword(e.target.value)} style={authInput} onKeyDown={(e) => e.key === "Enter" && submit()} />
        <button onClick={submit} disabled={busy} style={{ ...authBtn, opacity: busy ? 0.6 : 1, marginBottom: 14 }}>
          {busy ? "…" : mode === "login" ? "Σύνδεση" : "Εγγραφή"}
        </button>
        <div style={{ textAlign: "center", display: "flex", flexDirection: "column", gap: 8 }}>
          {mode === "login" ? (
            <>
              <button style={authLink} onClick={() => { setMode("register"); setError(""); }}>Δεν έχεις λογαριασμό; Κάνε εγγραφή</button>
              <button style={authLink} onClick={() => { setMode("forgot"); setError(""); }}>Ξέχασα τον κωδικό μου</button>
            </>
          ) : (
            <button style={authLink} onClick={() => { setMode("login"); setError(""); }}>Έχεις ήδη λογαριασμό; Συνδέσου</button>
          )}
        </div>
      </div>
    </div>
  );
}

function FamilySetupScreen({ user, onResolved }) {
  const [choice, setChoice] = useState(null); // null | "create" | "join"
  const [joinCode, setJoinCode] = useState("");
  const [createdCode, setCreatedCode] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  async function createFamily() {
    setBusy(true);
    setError("");
    try {
      let code = generateFamilyCode();
      // Extremely unlikely to collide, but check anyway before writing.
      for (let attempt = 0; attempt < 5; attempt++) {
        const existing = await db.collection("app_families").doc(code).get();
        if (!existing.exists) break;
        code = generateFamilyCode();
      }
      await db.collection("app_families").doc(code).set({
        createdBy: user.uid, createdAt: Date.now(), members: [user.uid],
      });
      await db.collection("app_users").doc(user.uid).set({ email: user.email, familyId: code }, { merge: true });
      setCreatedCode(code);
    } catch (e) {
      setError("Η δημιουργία απέτυχε. Δοκίμασε ξανά.");
    }
    setBusy(false);
  }

  async function joinFamily() {
    const code = joinCode.trim().toUpperCase();
    if (!code) { setError("Γράψε τον κωδικό πρόσκλησης."); return; }
    setBusy(true);
    setError("");
    try {
      const ref = db.collection("app_families").doc(code);
      const snap = await ref.get();
      if (!snap.exists) { setError("Δεν βρέθηκε οικογένεια με αυτόν τον κωδικό."); setBusy(false); return; }
      await ref.update({ members: firebase.firestore.FieldValue.arrayUnion(user.uid) });
      await db.collection("app_users").doc(user.uid).set({ email: user.email, familyId: code }, { merge: true });
      onResolved(code);
    } catch (e) {
      setError("Κάτι πήγε στραβά. Δοκίμασε ξανά.");
    }
    setBusy(false);
  }

  if (createdCode) {
    return (
      <div style={authWrap}>
        <div style={authCard}>
          <h1 style={authTitle}>Η οικογένειά σου είναι έτοιμη</h1>
          <p style={authSubtitle}>Μοιράσου αυτόν τον κωδικό με τον/την σύζυγο, ώστε να μπείτε στα ίδια δεδομένα</p>
          <div style={{ background: "#F1ECDD", borderRadius: 10, padding: "18px 0", textAlign: "center", fontSize: 30, fontWeight: 700, letterSpacing: 4, color: "#20293A", marginBottom: 18, fontFamily: "system-ui, sans-serif" }}>
            {createdCode}
          </div>
          <button onClick={() => onResolved(createdCode)} style={authBtn}>Συνέχεια στην εφαρμογή</button>
        </div>
      </div>
    );
  }

  if (choice === "create") {
    return (
      <div style={authWrap}>
        <div style={authCard}>
          <h1 style={authTitle}>Νέα οικογένεια</h1>
          <p style={authSubtitle}>Θα φτιάξουμε έναν κωδικό πρόσκλησης που θα δώσεις μετά στον/στη σύζυγο.</p>
          {error && <p style={authError}>{error}</p>}
          <button onClick={createFamily} disabled={busy} style={{ ...authBtn, opacity: busy ? 0.6 : 1, marginBottom: 10 }}>{busy ? "…" : "Δημιουργία οικογένειας"}</button>
          <button onClick={() => setChoice(null)} style={authBtnSecondary}>Πίσω</button>
        </div>
      </div>
    );
  }

  if (choice === "join") {
    return (
      <div style={authWrap}>
        <div style={authCard}>
          <h1 style={authTitle}>Συμμετοχή σε οικογένεια</h1>
          <p style={authSubtitle}>Γράψε τον κωδικό πρόσκλησης που σου έδωσε ο/η σύζυγος.</p>
          {error && <p style={authError}>{error}</p>}
          <input type="text" placeholder="π.χ. AB3CD9" value={joinCode} onChange={(e) => setJoinCode(e.target.value)} style={{ ...authInput, textAlign: "center", fontSize: 20, letterSpacing: 3, textTransform: "uppercase" }} onKeyDown={(e) => e.key === "Enter" && joinFamily()} />
          <button onClick={joinFamily} disabled={busy} style={{ ...authBtn, opacity: busy ? 0.6 : 1, marginBottom: 10 }}>{busy ? "…" : "Συμμετοχή"}</button>
          <button onClick={() => setChoice(null)} style={authBtnSecondary}>Πίσω</button>
        </div>
      </div>
    );
  }

  return (
    <div style={authWrap}>
      <div style={authCard}>
        <h1 style={authTitle}>Καλωσόρισες!</h1>
        <p style={authSubtitle}>Είσαι ο πρώτος γονέας που φτιάχνει την οικογένεια, ή έχεις ήδη κωδικό πρόσκλησης;</p>
        <button onClick={() => setChoice("create")} style={{ ...authBtn, marginBottom: 10 }}>Δημιουργία νέας οικογένειας</button>
        <button onClick={() => setChoice("join")} style={authBtnSecondary}>Έχω κωδικό πρόσκλησης</button>
      </div>
    </div>
  );
}

function AppGate() {
  const [user, setUser] = useState(undefined); // undefined = loading, null = signed out
  const [familyId, setFamilyId] = useState(undefined); // undefined = loading, null = not set yet
  const [failed, setFailed] = useState(false);

  // Demo mode: unchanged behaviour — anonymous auth, isolated demo collection, no family logic.
  useEffect(() => {
    if (!IS_DEMO) return;
    const unsub = firebase.auth().onAuthStateChanged((u) => { if (u) setUser(u); });
    firebase.auth().signInAnonymously().catch(() => setFailed(true));
    return unsub;
  }, []);

  // Real mode: email/password auth, then resolve (or set up) the user's family.
  useEffect(() => {
    if (IS_DEMO) return;
    const unsub = firebase.auth().onAuthStateChanged(async (u) => {
      setUser(u || null);
      if (u) {
        try {
          const snap = await db.collection("app_users").doc(u.uid).get();
          setFamilyId(snap.exists && snap.data().familyId ? snap.data().familyId : null);
        } catch (e) {
          setFailed(true);
        }
      } else {
        setFamilyId(null);
      }
    });
    return unsub;
  }, []);

  if (failed) {
    return <div style={{ padding: 24, fontFamily: "system-ui, sans-serif", color: "#B5533C" }}>Η σύνδεση με τη βάση απέτυχε. Έλεγξε τη σύνδεσή σου στο internet και δοκίμασε ξανά.</div>;
  }

  if (IS_DEMO) {
    if (!user) return <div style={{ padding: 24, fontFamily: "system-ui, sans-serif", color: "#6B6455" }}>Σύνδεση…</div>;
    window.__familyCollectionRef = null; // demo path uses DEMO_COLLECTION directly, not family-scoped
    return <TutoringLedger />;
  }

  if (user === undefined) return <div style={{ padding: 24, fontFamily: "system-ui, sans-serif", color: "#6B6455" }}>Φόρτωση…</div>;
  if (!user) return <LoginScreen />;
  if (familyId === undefined) return <div style={{ padding: 24, fontFamily: "system-ui, sans-serif", color: "#6B6455" }}>Φόρτωση…</div>;
  if (!familyId) return <FamilySetupScreen user={user} onResolved={setFamilyId} />;

  window.__familyCollectionRef = db.collection("app_families").doc(familyId).collection("data");
  window.__account = { email: user.email || "", familyId, signOut: () => firebase.auth().signOut() };
  return <AppWithTools user={user} />;
}

// Wraps the app. Adds the one-time "import old data" tool, only when the page is opened with ?import=1.
// Access to the old data is enforced by Firestore rules (verified owner email only), not by this screen.
function AppWithTools({ user }) {
  const wantsImport = urlParams.get("import") === "1";
  const [showImport, setShowImport] = useState(wantsImport);
  const [reloadKey, setReloadKey] = useState(0);
  return (
    <>
      <TutoringLedger key={reloadKey} />
      {showImport && <ImportOldData user={user} onClose={() => setShowImport(false)} onImported={() => setReloadKey((k) => k + 1)} />}
    </>
  );
}

function ImportOldData({ user, onClose, onImported }) {
  const [verified, setVerified] = useState(!!user.emailVerified);
  const [sent, setSent] = useState(false);
  const [busy, setBusy] = useState(false);
  const [done, setDone] = useState(false);
  const [msg, setMsg] = useState("");

  async function sendVerify() {
    setBusy(true); setMsg("");
    try { await firebase.auth().currentUser.sendEmailVerification(); setSent(true); }
    catch (e) { setMsg(friendlyAuthError(e.code)); }
    setBusy(false);
  }
  async function recheck() {
    setBusy(true); setMsg("");
    try {
      await firebase.auth().currentUser.reload();
      await firebase.auth().currentUser.getIdToken(true);
      const ok = !!firebase.auth().currentUser.emailVerified;
      setVerified(ok);
      if (!ok) setMsg("Δεν φαίνεται ακόμα επιβεβαιωμένο. Πάτησε το link στο email και ξαναδοκίμασε.");
    } catch (e) { setMsg("Κάτι πήγε στραβά. Δοκίμασε ξανά."); }
    setBusy(false);
  }
  async function runImport() {
    setBusy(true); setMsg("");
    try {
      const snap = await db.collection("tutoring_data").get();
      if (snap.empty) { setMsg("Δεν βρέθηκαν παλιά δεδομένα για εισαγωγή."); setBusy(false); return; }
      const target = window.__familyCollectionRef;
      let n = 0;
      for (const d of snap.docs) { await target.doc(d.id).set(d.data()); n++; }
      setMsg("Η εισαγωγή ολοκληρώθηκε: " + n + " εγγραφές."); setDone(true); onImported();
    } catch (e) {
      console.error(e);
      setMsg(e && e.code === "permission-denied" ? "Δεν επιτρέπεται η πρόσβαση στα παλιά δεδομένα από αυτόν τον λογαριασμό." : "Η εισαγωγή απέτυχε. Δοκίμασε ξανά.");
    }
    setBusy(false);
  }

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(32,41,58,0.55)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100, padding: 16 }}>
      <div style={{ ...authCard, maxWidth: 400 }}>
        <h1 style={{ ...authTitle, fontSize: 20 }}>Εισαγωγή παλιών δεδομένων</h1>
        <p style={{ ...authSubtitle, marginBottom: 16 }}>Μεταφέρει τα μαθήματα, τα παιδιά και τις πληρωμές της παλιάς εφαρμογής στην οικογένειά σου. Αν υπάρχουν ήδη ίδια στοιχεία εδώ, θα αντικατασταθούν.</p>
        {msg && <p style={{ ...authError, color: done ? "#5C7A5F" : "#B5533C" }}>{msg}</p>}
        {!verified ? (
          <>
            <p style={{ fontSize: 13, color: "#33404F", margin: "0 0 12px" }}>Για ασφάλεια, πρέπει πρώτα να επιβεβαιώσεις ότι το email <strong>{user.email}</strong> είναι δικό σου.</p>
            {!sent ? (
              <button onClick={sendVerify} disabled={busy} style={{ ...authBtn, opacity: busy ? 0.6 : 1, marginBottom: 10 }}>{busy ? "…" : "Στείλε email επιβεβαίωσης"}</button>
            ) : (
              <>
                <p style={{ fontSize: 13, color: "#5C7A5F", margin: "0 0 12px" }}>Στάλθηκε. Άνοιξε το email, πάτησε το link και γύρνα εδώ.</p>
                <button onClick={recheck} disabled={busy} style={{ ...authBtn, opacity: busy ? 0.6 : 1, marginBottom: 10 }}>{busy ? "…" : "Το επιβεβαίωσα"}</button>
              </>
            )}
          </>
        ) : !done ? (
          <button onClick={runImport} disabled={busy} style={{ ...authBtn, opacity: busy ? 0.6 : 1, marginBottom: 10 }}>{busy ? "Εισαγωγή…" : "Εισαγωγή τώρα"}</button>
        ) : null}
        <button onClick={onClose} style={authBtnSecondary}>{done ? "Κλείσιμο" : "Άκυρο"}</button>
      </div>
    </div>
  );
}

root.render(<AppGate />);
</script>
</body>
</html>
